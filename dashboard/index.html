<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Research Dashboard</title>
<style>
:root{--bg:#0f172a;--sur:#1e293b;--sur2:#273548;--sur3:#2f3f55;--bdr:#334155;--tx:#e2e8f0;--mu:#94a3b8;--bl:#3b82f6;--blh:#2563eb;--bld:rgba(59,130,246,.12);--gn:#22c55e;--gnd:rgba(34,197,94,.1);--rd:#f87171;--rdd:rgba(248,113,113,.1);--yw:#fbbf24;--ywd:rgba(251,191,36,.1);--pu:#a78bfa;--r:8px;--rl:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.6}
button{cursor:pointer;border:none;background:none;font-family:inherit;font-size:inherit;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--tx);background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--r);padding:9px 12px;width:100%;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--bl);box-shadow:0 0 0 3px var(--bld)}
textarea{resize:vertical;min-height:80px}
select option{background:var(--sur2)}
label{display:block;font-size:11px;color:var(--mu);margin-bottom:5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
a{color:var(--bl);text-decoration:none}
a:hover{text-decoration:underline}
#app{display:flex;flex-direction:column;height:100vh}
.hdr{padding:12px 24px;background:var(--sur);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;flex-wrap:wrap}
.hdr-t{font-size:15px;font-weight:800;letter-spacing:-.3px}.hdr-t .bl{color:var(--bl)}
.hdr-r{display:flex;align-items:center;gap:10px}
.hdr-s{font-size:12px;color:var(--mu)}
.cbar{background:var(--sur);border-bottom:1px solid var(--bdr);padding:12px 24px;flex-shrink:0}
.cbar-l{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);margin-bottom:10px}
.cbar-b{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cpill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:30px;border:2px solid var(--bdr);color:var(--mu);font-size:13px;font-weight:600;transition:all .18s;background:none;white-space:nowrap}
.cpill:hover{border-color:var(--mu);color:var(--tx)}
.cpill.on{color:#fff;border-color:transparent}
.cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ccnt{font-size:11px;opacity:.7;background:rgba(0,0,0,.25);padding:1px 7px;border-radius:20px}
.cpill .cx{opacity:0;font-size:11px;line-height:1;transition:opacity .15s}
.cpill:hover .cx{opacity:.6}.cpill .cx:hover{opacity:1!important}
.cadd{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:30px;border:2px dashed var(--bdr);color:var(--mu);font-size:13px;font-weight:600;transition:all .18s}
.cadd:hover{border-color:var(--bl);color:var(--bl)}
.tabs{display:flex;gap:2px;padding:12px 24px 0;background:var(--sur);border-bottom:1px solid var(--bdr);flex-shrink:0;overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tbtn{padding:8px 16px;border-radius:var(--r) var(--r) 0 0;font-size:13px;font-weight:600;color:var(--mu);transition:all .15s;white-space:nowrap;border:1px solid transparent;border-bottom:none;margin-bottom:-1px}
.tbtn:hover{color:var(--tx);background:var(--sur2)}.tbtn.on{color:var(--bl);background:var(--bg);border-color:var(--bdr)}
.tc{flex:1;overflow-y:auto;padding:24px}.tp{display:none}.tp.on{display:block}
.ph{margin-bottom:20px}.ph-title{font-size:18px;font-weight:700;margin-bottom:4px}
.ph-desc{font-size:13px;color:var(--mu);max-width:640px}
.ph-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-size:13px;font-weight:600;transition:all .15s;border:none;cursor:pointer}
.btn-p{background:var(--bl);color:#fff}.btn-p:hover{background:var(--blh)}
.btn-g{background:var(--sur2);color:var(--mu);border:1px solid var(--bdr)}.btn-g:hover{color:var(--tx);border-color:var(--mu)}
.btn-d{background:var(--rdd);color:var(--rd);border:1px solid transparent}.btn-d:hover{border-color:var(--rd)}
.btn-gen{background:linear-gradient(135deg,#6366f1,#3b82f6);color:#fff}.btn-gen:hover{opacity:.9}
.btn-s{padding:5px 11px;font-size:12px}
.tw{overflow-x:auto;border-radius:var(--rl);border:1px solid var(--bdr)}
table{width:100%;border-collapse:collapse}
th{background:var(--sur);padding:10px 14px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);border-bottom:1px solid var(--bdr);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--bdr);vertical-align:middle}
tr:last-child td{border-bottom:none}tr:hover td{background:rgba(59,130,246,.03)}
.tda{display:flex;gap:6px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:18px;display:flex;flex-direction:column;gap:12px}
.card:hover{border-color:var(--sur3)}
.ct{font-size:14px;font-weight:700}
.chook{font-size:13px;color:var(--bl);font-style:italic;line-height:1.5;border-left:2px solid var(--bl);padding-left:10px}
.cbody{font-size:13px;color:var(--mu);line-height:1.6}
.ctags{display:flex;gap:6px;flex-wrap:wrap}
.cft{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--bdr)}
.cac{display:flex;gap:6px;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.bb{background:var(--bld);color:var(--bl)}.bg{background:var(--gnd);color:var(--gn)}
.br{background:var(--rdd);color:var(--rd)}.by{background:var(--ywd);color:var(--yw)}
.bp{background:rgba(167,139,250,.1);color:var(--pu)}.bm{background:var(--sur2);color:var(--mu)}
/* CTA Bank */
.cta-grp{margin-bottom:26px}
.cta-grp-hdr{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);padding-bottom:10px;border-bottom:1px solid var(--bdr);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.cta-list{display:flex;flex-direction:column;gap:8px}
.cta-it{display:flex;align-items:center;gap:12px;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);padding:12px 14px;transition:border-color .15s}
.cta-it.used{border-color:var(--bl);background:var(--bld)}
.cta-tx{flex:1;font-size:13px;line-height:1.5}
.cta-ac{display:flex;gap:6px;flex-shrink:0}
.cta-add-row{display:flex;gap:8px;margin-top:10px}.cta-add-row input{flex:1}
/* Content Pipeline kanban */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}
.kcol{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rl);padding:14px;min-height:160px}
.kch{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.kcnt{background:var(--sur2);padding:1px 8px;border-radius:20px;font-size:11px}
.kcol[data-s=Idea] .kch{color:var(--bl)}.kcol[data-s=Scripted] .kch{color:var(--yw)}
.kcol[data-s=Filmed] .kch{color:var(--pu)}.kcol[data-s=Posted] .kch{color:var(--gn)}
.kcard{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--r);padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.kcard:hover{border-color:var(--bl)}
.kct{font-size:13px;font-weight:600;margin-bottom:5px}
.kchook{font-size:12px;color:var(--bl);font-style:italic;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:6px}
.kcta{font-size:11px;color:var(--gn);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kcft{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
/* Idea detail */
.idea-detail{background:var(--sur);border:1px solid var(--bl);border-radius:var(--rl);padding:20px;margin-top:16px;display:flex;flex-direction:column;gap:16px}
.idea-detail-hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.dlbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.script-box{font-size:13px;line-height:1.7;color:var(--mu);white-space:pre-wrap;background:var(--sur2);border-radius:var(--r);padding:14px}
.script-box .ph{color:var(--bl);background:var(--bld);padding:0 4px;border-radius:3px}
.cta-highlight{background:var(--gnd);border:1px solid var(--gn);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--gn);line-height:1.5}
/* Script templates section */
.section-divider{display:flex;align-items:center;gap:12px;margin:28px 0 20px}
.section-divider span{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mu);white-space:nowrap}
.section-divider::before,.section-divider::after{content:'';flex:1;border-top:1px solid var(--bdr)}
/* Generate prompt modal */
.prompt-box{font-family:monospace;font-size:12px;background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;line-height:1.6;color:var(--tx);white-space:pre-wrap;max-height:300px;overflow-y:auto}
/* Gaps */
.git{display:flex;align-items:flex-start;gap:12px;padding:13px;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--r);margin-bottom:8px;max-width:720px}
.git.done{opacity:.4}.git.done .gtx{text-decoration:line-through}
.gck{width:18px;height:18px;accent-color:var(--bl);cursor:pointer;flex-shrink:0;margin-top:2px}
.gtx{flex:1;font-size:13px;line-height:1.5}
.gadd{display:flex;gap:8px;margin-top:12px;max-width:720px}.gadd input{flex:1}
.tip{background:var(--bld);border:1px solid rgba(59,130,246,.2);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--mu);margin-bottom:20px;line-height:1.6}
.tip strong{color:var(--bl)}
.bdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;align-items:center;justify-content:center;padding:20px}
.bdrop.on{display:flex}
.modal{background:var(--sur);border:1px solid var(--bdr);border-radius:16px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--bdr)}
.mttl{font-size:15px;font-weight:700}
.mbdy{padding:20px;display:flex;flex-direction:column;gap:14px}
.mft{padding:16px 20px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:10px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ff{display:flex;flex-direction:column}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s}
.sw.on{border-color:#fff;transform:scale(1.15)}
.empty{text-align:center;padding:48px 20px;color:var(--mu);font-size:13px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--sur);border:1px solid var(--bl);color:var(--tx);padding:10px 18px;border-radius:var(--r);font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.imp-ta{font-family:monospace;font-size:12px;min-height:120px}
@media(max-width:900px){.kanban{grid-template-columns:1fr 1fr}.frow{grid-template-columns:1fr}}
@media(max-width:640px){.kanban{grid-template-columns:1fr}.cg{grid-template-columns:1fr}.tc{padding:14px}table th:nth-child(n+5),table td:nth-child(n+5){display:none}}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="hdr-t">📊 Instagram <span class="bl">Research Dashboard</span></div>
    <div class="hdr-r">

  <div class="cbar">
    <div class="cbar-l">Client</div>

  </div>

  <div class="tc" id="tc"></div>
</div>
<div class="bdrop" id="bdrop">
  <div class="modal">
    <div class="mhd"><div class="mttl" id="mttl"></div><button class="btn btn-g btn-s" onclick="closeModal()">✕</button></div>
    <div class="mbdy" id="mbdy"></div>

</div>
<div class="toast" id="toast"></div>

// ── STATE ─────────────────────────────────────
const S=(()=>{
  let d=null;
  function load(){
    const raw=localStorage.getItem('ird_v5');
    if(raw){d=JSON.parse(raw);}
    else{
      const old=localStorage.getItem('ird_v4')||localStorage.getItem('ur_dashboard_v3')||localStorage.getItem('ur_dashboard');
      d=old?JSON.parse(old):JSON.parse(JSON.stringify(DEFAULTS));
      if(!d.clients)d.clients=JSON.parse(JSON.stringify(DEFAULTS.clients));
      ['coaches','reels','ctaBank','contentIdeas','contentGaps'].forEach(s=>{(d[s]||[]).forEach(x=>{if(!x.clientId)x.clientId='cl2'})});
      // ensure cl1 ideas exist
      const hasCl1Ideas=d.contentIdeas&&d.contentIdeas.some(x=>x.clientId==='cl1');
      if(!hasCl1Ideas){
        DEFAULTS.contentIdeas.filter(x=>x.clientId==='cl1').forEach(item=>{
          if(!d.contentIdeas)d.contentIdeas=[];
          if(!d.contentIdeas.find(x=>x.id===item.id))d.contentIdeas.push(JSON.parse(JSON.stringify(item)));
        });
      }
    }
  }
  function save(){d.meta.lastSaved=new Date().toISOString();localStorage.setItem('ird_v5',JSON.stringify(d));const el=document.getElementById('last-saved');if(el)el.textContent='Saved '+new Date().toLocaleTimeString()}
  function get(k){return d[k]}
  function upsert(sec,item){const i=d[sec].findIndex(x=>x.id===item.id);if(i>=0)d[sec][i]=item;else d[sec].unshift(item);save()}
  function del(sec,id){d[sec]=d[sec].filter(x=>x.id!==id);save()}
  function tog(sec,id,f){const x=d[sec].find(x=>x.id===id);if(x){x[f]=!x[f];save()}}
  function setF(sec,id,f,v){const x=d[sec].find(x=>x.id===id);if(x){x[f]=v;save()}}
  return{load,save,get,upsert,del,tog,setF};
})();

// ── UTILS ─────────────────────────────────────
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(n){if(!n)return'—';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n)}
function vir(v,f){if(!f)return 0;return+((v/f)*100).toFixed(1)}
function vBadge(s){if(!s)return'<span class="b bm">—</span>';if(s>=200)return`<span class="b br">🔥 ${s}%</span>`;if(s>=50)return`<span class="b bg">⚡ ${s}%</span>`;if(s>=10)return`<span class="b bb">${s}%</span>`;return`<span class="b bm">${s}%</span>`}
function sBadge(s){const m={Idea:'bb',Scripted:'by',Filmed:'bp',Posted:'bg'};return`<span class="b ${m[s]||'bm'}">${s}</span>`}
function ctaBadge(t){const m={DM:'bg','Link in Bio':'bp',Comment:'by',Save:'bb',Follow:'bm','Direct Offer':'br'};return`<span class="b ${m[t]||'bm'}">${t}</span>`}
function hlPh(t){return esc(t).replace(/\[([^\]]+)\]/g,'<span class="ph">[$1]</span>')}
async function cp(text,btn){try{if(navigator.clipboard)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)}if(btn){const o=btn.textContent;btn.textContent='✓ Copied!';setTimeout(()=>btn.textContent=o,1500)}toast('Copied!')}catch{toast('Copy failed')}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2300)}

function buildFields(fields,init){const rows=[];let buf=[];fields.forEach((f,i)=>{const el=buildF(f,init[f.k]);if(f.half){buf.push(el);if(buf.length===2||i===fields.length-1){rows.push(`<div class="frow">${buf.join('')}</div>`);buf=[]}}else{if(buf.length){rows.push(`<div class="frow">${buf.join('')}</div>`);buf=[]}rows.push(`<div class="ff">${el}</div>`)}});return rows.join('')}
function buildF(f,val){const v=val!=null?val:(f.def||'');let inp='';if(f.type==='textarea')inp=`<textarea data-f="${f.k}" rows="3">${esc(v)}</textarea>`;else if(f.type==='select'){const opts=f.opts.map((o,i)=>`<option value="${esc(f.vals?f.vals[i]:o)}" ${(f.vals?f.vals[i]:o)===v?'selected':''}>${esc(o)}</option>`).join('');inp=`<select data-f="${f.k}">${opts}</select>`}else if(f.type==='number')inp=`<input type="number" data-f="${f.k}" value="${esc(String(v))}" min="0">`;else if(f.readonly)inp=`<input type="text" data-f="${f.k}" value="${esc(v)}" readonly style="opacity:.5;pointer-events:none">`;else inp=`<input type="text" data-f="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;return`<div class="ff"><label>${esc(f.label)}</label>${inp}</div>`}
function attachCalc(){const b=document.getElementById('mbdy');const upd=()=>{const v=b.querySelector('[data-f="avgViews"],[data-f="views"]'),f=b.querySelector('[data-f="followers"]'),s=b.querySelector('[data-f="viralityScore"]');if(v&&f&&s)s.value=vir(parseFloat(v.value)||0,parseFloat(f.value)||0)};['avgViews','views','followers'].forEach(k=>b.querySelector(`[data-f="${k}"]`)?.addEventListener('input',upd))}

}

// ── COACHES ───────────────────────────────────
function coachF(){return[cf(),{k:'handle',label:'Instagram Handle',ph:'@username'},{k:'followers',label:'Followers',type:'number',half:true},{k:'avgViews',label:'Avg Views/Reel',type:'number',half:true},{k:'viralityScore',label:'Virality (auto)',readonly:true,half:true},{k:'offerType',label:'What They Sell',type:'select',half:true,opts:['1:1 Coaching','Group Coaching','Training Plans','Course','App','Community','Hybrid','Other']},{k:'ctaType',label:'Lead Gen Method',type:'select',opts:['DM','Link in Bio','Comment','Save','Follow','Direct Offer','Content → Podcast','DM + Community','Content Only']},{k:'notes',label:'Notes',type:'textarea'}]}
function renderCoaches(){
  const c=forC(S.get('coaches'));
  return`<div class="ph"><div class="ph-title">Competitor Coaches</div><div class="ph-desc">Track what other coaches are doing — their audience, offer, and how they get leads from Reels.</div><div class="ph-actions"><button class="btn btn-p" onclick="addCoach()">+ Add Coach</button><span style="font-size:12px;color:var(--mu)">${c.length} tracked</span></div></div>
  <div class="tw"><table><thead><tr><th>Handle</th><th>Followers</th><th>Avg Views</th><th>Virality</th><th>Offer</th><th>Lead Gen</th>${activeClient==='all'?'<th>Client</th>':''}<th>Notes</th><th></th></tr></thead><tbody>${c.length?c.map(x=>`<tr><td><a href="https://instagram.com/${x.handle.replace('@','')}" target="_blank" style="font-weight:600">${esc(x.handle)}</a></td><td>${fmt(x.followers)}</td><td>${fmt(x.avgViews)}</td><td>${vBadge(x.viralityScore)}</td><td><span class="b bm">${esc(x.offerType)}</span></td><td>${ctaBadge(x.ctaType)}</td>${activeClient==='all'?`<td>${cBadge(x.clientId)}</td>`:''}<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mu);font-size:12px">${esc(x.notes)}</td><td><div class="tda"><button class="btn btn-g btn-s" onclick="editCoach('${x.id}')">Edit</button><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('coaches','${x.id}'),renderTab('Coaches')">✕</button></div></td></tr>`).join(''):`<tr><td colspan="9"><div class="empty">No coaches yet.</div></td></tr>`}</tbody></table></div>`;
}
function addCoach(){openModal('Add Coach',coachF(),d=>{d.id=uid();d.createdAt=new Date().toISOString().slice(0,10);d.viralityScore=vir(d.avgViews,d.followers);S.upsert('coaches',d);renderTab('Coaches')})}
function editCoach(id){const c=S.get('coaches').find(x=>x.id===id);openModal('Edit Coach',coachF(),d=>{d.id=id;d.createdAt=c.createdAt;d.viralityScore=vir(d.avgViews,d.followers);S.upsert('coaches',d);renderTab('Coaches')},c)}

// ── REELS ─────────────────────────────────────
function reelF(){return[cf(),{k:'coachHandle',label:'Coach Handle',ph:'@username',half:true},{k:'followers',label:'Their Followers',type:'number',half:true},{k:'views',label:'Views',type:'number',half:true},{k:'viralityScore',label:'Virality (auto)',readonly:true,half:true},{k:'format',label:'Format',type:'select',half:true,opts:['Talking Head','B-roll + Voiceover','Text on Screen','Tutorial / Demo','Transformation','Mixed']},{k:'topic',label:'Topic',type:'select',half:true,opts:['Training Tips','Race Strategy','Transformation','Nutrition','Mindset','Gear','Q&A','Behind the Scenes','Controversial Take','Other']},{k:'hookText',label:'Opening Hook — exact words',type:'textarea'},{k:'scriptSummary',label:'Script Summary',type:'textarea'},{k:'ctaWording',label:'Call to Action — exact words',type:'textarea'},{k:'link',label:'Reel URL',ph:'https://instagram.com/reel/...'}]}
function renderReels(){
  const all=forC(S.get('reels'));
  const topics=[...new Set(all.map(r=>r.topic))].filter(Boolean);
  const tF=document.getElementById('rf-t')?.value||'';
  const reels=all.filter(r=>!tF||r.topic===tF);
  return`<div class="ph"><div class="ph-title">Reels Research</div><div class="ph-desc">Top-performing Reels — hooks, scripts, and CTAs worth learning from.</div><div class="ph-actions"><button class="btn btn-p" onclick="addReel()">+ Add Reel</button><select id="rf-t" onchange="renderTab('Reels')" style="max-width:170px"><option value="">All Topics</option>${topics.map(t=>`<option value="${esc(t)}" ${t===tF?'selected':''}>${esc(t)}</option>`).join('')}</select><span style="font-size:12px;color:var(--mu)">${reels.length} reels</span></div></div>
  <div class="cg">${reels.length?reels.map(r=>`<div class="card"><div class="ctags">${vBadge(r.viralityScore)}<span class="b bm">${esc(r.format||'—')}</span><span class="b bb">${esc(r.topic||'—')}</span>${cBadge(r.clientId)}</div><div class="chook">"${esc(r.hookText)}"</div><div><div style="font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mu);margin-bottom:5px">Script</div><div class="cbody">${esc(r.scriptSummary)}</div></div><div><div style="font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mu);margin-bottom:5px">Call to Action</div><div style="font-size:13px;color:var(--gn);line-height:1.5">${esc(r.ctaWording)}</div></div><div class="cft"><div style="font-size:12px;color:var(--mu)">${esc(r.coachHandle||'—')}</div><div class="cac">${r.link?`<a href="${esc(r.link)}" target="_blank" class="btn btn-g btn-s">View ↗</a>`:''}<button class="btn btn-g btn-s" onclick="editReel('${r.id}')">Edit</button><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('reels','${r.id}'),renderTab('Reels')">✕</button></div></div></div>`).join(''):'<div class="empty">No reels yet.</div>'}</div>`;
}
function addReel(){openModal('Add Reel',reelF(),d=>{d.id=uid();d.dateAdded=new Date().toISOString().slice(0,10);d.viralityScore=vir(d.views,d.followers);S.upsert('reels',d);renderTab('Reels')})}
function editReel(id){const r=S.get('reels').find(x=>x.id===id);openModal('Edit Reel',reelF(),d=>{d.id=id;d.dateAdded=r.dateAdded;d.viralityScore=vir(d.views,d.followers);S.upsert('reels',d);renderTab('Reels')},r)}

// ── CTA BANK ──────────────────────────────────
function renderCTABank(){
  const ctas=forC(S.get('ctaBank'));const used=ctas.filter(c=>c.usedIt).length;
  let h=`<div class="ph"><div class="ph-title">CTA Bank</div><div class="ph-desc">Ready-to-use calls to action. Copy and drop into your next Reel.</div></div><div class="tip"><strong>Tip:</strong> DM CTAs convert at 12–25%. Link in Bio converts at 1.5–3%. &nbsp;·&nbsp; ${used}/${ctas.length} used.</div>`;
  CTA_TYPES.forEach(type=>{
    const items=ctas.filter(c=>c.type===type);
    const safe=type.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9-]/g,'');
    h+=`<div class="cta-grp"><div class="cta-grp-hdr"><span style="color:${CTA_C[type]||'var(--tx)'}">▸ ${type}</span><span style="font-weight:400">${items.filter(c=>c.usedIt).length}/${items.length} used &nbsp;<button class="btn btn-g btn-s" onclick="showCtaForm('${safe}')">+ Add</button></span></div><div class="cta-list">${items.map(c=>`<div class="cta-it ${c.usedIt?'used':''}"><div class="cta-tx">${cBadge(c.clientId)} ${esc(c.text)}</div><div class="cta-ac"><button class="btn btn-g btn-s" onclick="cp('${esc(c.text.replace(/'/g,"\\'"))}',this)">Copy</button><button class="btn btn-g btn-s" onclick="S.tog('ctaBank','${c.id}','usedIt');renderTab('CTA Bank')">${c.usedIt?'✓ Used':'Used It'}</button><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('ctaBank','${c.id}'),renderTab('CTA Bank')">✕</button></div></div>`).join('')||`<div style="font-size:13px;color:var(--mu);padding:8px 0">None yet.</div>`}</div><div class="cta-add-row" id="ca-${safe}" style="display:none"><input id="ci-${safe}" type="text" placeholder="New ${esc(type)} CTA..." onkeydown="if(event.key==='Enter')saveCTA('${safe}','${esc(type)}')"><button class="btn btn-p btn-s" onclick="saveCTA('${safe}','${esc(type)}')">Add</button><button class="btn btn-g btn-s" onclick="document.getElementById('ca-${safe}').style.display='none'">✕</button></div></div>`;
  });return h;
}
function showCtaForm(safe){const el=document.getElementById(`ca-${safe}`);if(el){el.style.display='flex';el.querySelector('input')?.focus()}}
function saveCTA(safe,type){const inp=document.getElementById(`ci-${safe}`);if(!inp||!inp.value.trim())return;const cid=activeClient!=='all'?activeClient:(S.get('clients')[0]?.id||'');S.upsert('ctaBank',{id:uid(),clientId:cid,type,text:inp.value.trim(),usedIt:false});renderTab('CTA Bank')}

// ── CONTENT PIPELINE ──────────────────────────
function ideaF(){return[cf(),
  {k:'title',label:'Idea Title',ph:'e.g. Why Beginners Quit'},
  {k:'hook',label:'Opening Hook — the first line that stops the scroll',type:'textarea'},
  {k:'scriptOutline',label:'Script Outline',type:'textarea'},
  {k:'scriptTemplate',label:'Full Script (use [BRACKETS] for fill-in parts)',type:'textarea'},
  {k:'ctaRecommendation',label:'Best Call to Action',type:'textarea'},
  {k:'ctaType',label:'CTA Type',type:'select',opts:['DM','Comment','Save','Link in Bio','Follow','Direct Offer'],half:true},
  {k:'status',label:'Stage',type:'select',half:true,opts:['Idea','Scripted','Filmed','Posted']},
]}

function generatePrompt(){
  const clients=S.get('clients');
  const cl=activeClient!=='all'?clients.find(x=>x.id===activeClient):null;
  const coaches=forC(S.get('coaches')).slice(0,6).map(c=>c.handle).join(', ');
  const existing=forC(S.get('contentIdeas')).slice(0,5).map(i=>i.title).join('; ');
  const clientDesc=cl?`Client: ${cl.name}`:'Clients: Running Coach (All Levels) @runwithnick AND Ultra Running Coach @joshc.laker';
  const prompt=`You are a content research agent for Instagram running coaches.

${clientDesc}

Competitor accounts to study: ${coaches||'@trackclubbabe, @runningexplained, @stephpiruns, @percelldugger'}

Existing ideas (don't duplicate): ${existing||'none yet'}

Search Instagram and the web for viral running coach Reels from the last 30 days. Then generate 5 brand new content ideas based on what is performing well right now.

Output ONLY valid JSON in this exact format — no explanation, just the JSON:

{
  "clientId": "${activeClient!=='all'?activeClient:'cl1'}",
  "contentIdeas": [
    {
      "title": "Short punchy title",
      "hook": "Exact opening line that stops the scroll",
      "scriptOutline": "Brief outline: hook → problem → solution → CTA",
      "scriptTemplate": "[HOOK]\\n\\"...opening line...\\"\\n\\n[PROBLEM]\\n\\"...pain point...\\"\\n\\n[SOLUTION]\\n\\"...value...\\"\\n\\n[CTA]\\n\\"...call to action...\\"",
      "ctaRecommendation": "Exact CTA wording",
      "ctaType": "DM",
      "status": "Idea"
    }
  ],
  "ctaBank": [
    {"type": "DM", "text": "Any new CTA formats you spotted"}
  ],
  "contentGaps": [
    {"topic": "Any gaps you noticed competitors missing"}
  ]
}`;
  cp(prompt);
  openModal('🤖 Generate New Ideas',[],()=>{},null,`
    <div class="tip"><strong>How this works:</strong><br>1. Click "Copy Prompt" below<br>2. Paste it into a new Claude conversation<br>3. Claude will research and output JSON<br>4. Come back, click "⬇ Import Research" in the header, paste the JSON</div>
    <div class="ff"><label>Your Research Prompt (copied to clipboard)</label><div class="prompt-box">${esc(prompt)}</div></div>
    <div style="margin-top:8px"><button class="btn btn-p" onclick="cp(document.querySelector('.prompt-box').textContent,this)">Copy Prompt Again</button></div>`);
  document.getElementById('msave').style.display='none';
}

function renderContentPipeline(){
  const ideas=forC(S.get('contentIdeas'));
  const cols=KCOLS.map(status=>{
    const items=ideas.filter(i=>i.status===status);
    return`<div class="kcol" data-s="${status}"><div class="kch">${status}<span class="kcnt">${items.length}</span></div>${items.map(i=>`<div class="kcard" onclick="openIdea('${i.id}')"><div class="kct">${esc(i.title)}</div><div class="kchook">"${esc(i.hook)}"</div><div class="kcta">▸ ${esc(i.ctaRecommendation||'No CTA set')}</div><div class="kcft">${cBadge(i.clientId)}<div style="display:flex;gap:6px"><select class="btn btn-g btn-s" onclick="event.stopPropagation()" onchange="S.setF('contentIdeas','${i.id}','status',this.value);renderTab('Content Pipeline')" style="width:auto;padding:3px 8px">${KCOLS.map(s=>`<option ${s===i.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn btn-d btn-s" onclick="event.stopPropagation();if(confirm('Delete?'))S.del('contentIdeas','${i.id}'),renderTab('Content Pipeline')">✕</button></div></div></div>`).join('')||`<div style="font-size:12px;color:var(--mu);padding:6px 0">Empty</div>`}</div>`;
  }).join('');

  return`<div class="ph">
    <div class="ph-title">Content Pipeline</div>
    <div class="ph-desc">Every idea has its hook, full script, and best CTA in one place. Click any card to see the complete brief ready to record.</div>
    <div class="ph-actions">
      <button class="btn btn-gen" onclick="generatePrompt()">🤖 Generate Ideas with AI</button>
      <button class="btn btn-p" onclick="addIdea()">+ Add Manually</button>
      <span style="font-size:12px;color:var(--mu)">${ideas.filter(i=>i.status==='Posted').length} posted · ${ideas.length} total</span>
    </div>
  </div>
  <div class="kanban">${cols}</div>
  <div id="idea-detail"></div>`;
}

function openIdea(id){
  const i=S.get('contentIdeas').find(x=>x.id===id);if(!i)return;
  const el=document.getElementById('idea-detail');if(!el)return;
  el.innerHTML=`<div class="idea-detail">
    <div class="idea-detail-hdr">
      <div style="font-size:17px;font-weight:700">${esc(i.title)}</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${sBadge(i.status)} ${ctaBadge(i.ctaType||'DM')} ${cBadge(i.clientId)}</div>
    </div>
    <div><div class="dlbl">Opening Hook — use this as your first line</div><div class="chook" style="font-size:14px">"${esc(i.hook)}"</div></div>
    ${i.scriptTemplate?`<div><div class="dlbl">Full Script — fill in the [BRACKETS]</div><pre class="script-box">${hlPh(i.scriptTemplate)}</pre></div>`:''}
    ${i.scriptOutline&&!i.scriptTemplate?`<div><div class="dlbl">Script Outline</div><div class="cbody" style="white-space:pre-wrap">${esc(i.scriptOutline)}</div></div>`:''}
    <div><div class="dlbl">Best Call to Action for this post</div><div class="cta-highlight">${esc(i.ctaRecommendation||'No CTA set')}</div></div>
    <div class="cft">
      <button class="btn btn-p btn-s" onclick="cp(${JSON.stringify((i.hook||'')+'\n\n'+(i.scriptTemplate||i.scriptOutline||'')+'\n\nCTA: '+(i.ctaRecommendation||''))},this)">Copy Full Brief</button>
      <button class="btn btn-g btn-s" onclick="editIdea('${i.id}')">Edit</button>
      <button class="btn btn-g btn-s" onclick="document.getElementById('idea-detail').innerHTML=''">Close</button>
    </div>
  </div>`;
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function addIdea(){openModal('Add Content Idea',ideaF(),d=>{d.id=uid();d.createdAt=new Date().toISOString().slice(0,10);S.upsert('contentIdeas',d);renderTab('Content Pipeline')})}
function editIdea(id){const i=S.get('contentIdeas').find(x=>x.id===id);openModal('Edit Idea',ideaF(),d=>{d.id=id;d.createdAt=i.createdAt;S.upsert('contentIdeas',d);renderTab('Content Pipeline')},i)}

// ── GAPS ──────────────────────────────────────
function renderGaps(){
  const gaps=forC(S.get('contentGaps'));const open=gaps.filter(g=>!g.covered).length,done=gaps.filter(g=>g.covered).length;
  return`<div class="ph"><div class="ph-title">Content Gaps</div><div class="ph-desc">Topics your audience wants that competitors aren't covering. Tick them off as you make content.</div><div class="ph-actions">${done?`<button class="btn btn-g" onclick="clearGaps()">Clear Completed (${done})</button>`:''}<span style="font-size:12px;color:var(--mu)">${open} open · ${done} covered</span></div></div>
  <div class="tip"><strong>Each unchecked gap is a Reel your competitors aren't making.</strong> Start with the one your audience mentions most.</div>
  ${gaps.map(g=>`<div class="git ${g.covered?'done':''}"><input type="checkbox" class="gck" ${g.covered?'checked':''} onchange="S.tog('contentGaps','${g.id}','covered');renderTab('Gaps')"><div class="gtx">${cBadge(g.clientId)} ${esc(g.topic)}</div><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('contentGaps','${g.id}'),renderTab('Gaps')">✕</button></div>`).join('')||'<div class="empty">No gaps yet.</div>'}
  <div class="gadd"><input id="gap-inp" type="text" placeholder="Describe a topic your audience wants that nobody is covering..." onkeydown="if(event.key==='Enter')saveGap()"><button class="btn btn-p" onclick="saveGap()">Add Gap</button></div>`;
}
function saveGap(){const inp=document.getElementById('gap-inp');if(!inp||!inp.value.trim())return;const cid=activeClient!=='all'?activeClient:(S.get('clients')[0]?.id||'');S.upsert('contentGaps',{id:uid(),clientId:cid,topic:inp.value.trim(),covered:false});renderTab('Gaps')}
function clearGaps(){const all=S.get('contentGaps'),keep=all.filter(g=>!g.covered||(activeClient!=='all'&&g.clientId!==activeClient));all.length=0;keep.forEach(x=>all.push(x));S.save();renderTab('Gaps')}

// ── ROUTER ────────────────────────────────────
const RENDERERS={'Coaches':renderCoaches,'Reels':renderReels,'CTA Bank':renderCTABank,'Content Pipeline':renderContentPipeline,'Gaps':renderGaps};
let activeTab=TABS[0];
function renderTab(name){
  activeTab=name;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  document.querySelectorAll('.tp').forEach(p=>p.classList.toggle('on',p.id===`tp-${TID[name]}`));
  const panel=document.getElementById(`tp-${TID[name]}`);
  if(panel)panel.innerHTML=RENDERERS[name]()||'';
}

// ── INIT ──────────────────────────────────────
function init(){
  S.load();renderCBar();
  document.getElementById('tabs').innerHTML=TABS.map(t=>`<button class="tbtn ${t===activeTab?'on':''}" data-tab="${t}" onclick="renderTab('${t}')">${t}</button>`).join('');
  document.getElementById('tc').innerHTML=TABS.map(t=>`<div class="tp ${t===activeTab?'on':''}" id="tp-${TID[t]}"></div>`).join('');
  renderTab(activeTab);
  const saved=S.get('meta').lastSaved;
  if(saved)document.getElementById('last-saved').textContent='Last saved '+new Date(saved).toLocaleString();
}
init();
</script>
</body>
</html>
