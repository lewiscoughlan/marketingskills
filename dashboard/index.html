<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Research Dashboard</title>
<style>
:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface-2: #273548;
  --surface-3: #2f3f55;
  --border: #334155;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --blue: #3b82f6;
  --blue-h: #2563eb;
  --blue-d: rgba(59,130,246,0.12);
  --green: #22c55e;
  --green-d: rgba(34,197,94,0.1);
  --red: #f87171;
  --red-d: rgba(248,113,113,0.1);
  --yellow: #fbbf24;
  --yellow-d: rgba(251,191,36,0.1);
  --purple: #a78bfa;
  --r: 8px; --rl: 12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.6}
button{cursor:pointer;border:none;background:none;font-family:inherit;font-size:inherit;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;width:100%;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-d)}
textarea{resize:vertical;min-height:80px}
select option{background:var(--surface-2)}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

#app{display:flex;flex-direction:column;height:100vh}

/* Header */
.hdr{padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;flex-wrap:wrap}
.hdr-title{font-size:15px;font-weight:800;letter-spacing:-.3px}
.hdr-title .bl{color:var(--blue)}
.hdr-right{display:flex;align-items:center;gap:10px}
.hdr-saved{font-size:12px;color:var(--muted)}

/* Client bar */
.cbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;flex-shrink:0}
.cbar-label{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.cbar-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cpill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:30px;border:2px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;transition:all .18s;background:none;white-space:nowrap}
.cpill:hover{border-color:var(--muted);color:var(--text)}
.cpill.on{color:#fff;border-color:transparent}
.cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ccnt{font-size:11px;opacity:.7;background:rgba(0,0,0,.25);padding:1px 7px;border-radius:20px}
.cpill .cx{opacity:0;font-size:11px;line-height:1;transition:opacity .15s}
.cpill:hover .cx{opacity:.6}
.cpill .cx:hover{opacity:1!important}
.cadd{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:30px;border:2px dashed var(--border);color:var(--muted);font-size:13px;font-weight:600;transition:all .18s}
.cadd:hover{border-color:var(--blue);color:var(--blue)}

/* Tabs */
.tabs{display:flex;gap:2px;padding:12px 24px 0;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tbtn{padding:8px 16px;border-radius:var(--r) var(--r) 0 0;font-size:13px;font-weight:600;color:var(--muted);transition:all .15s;white-space:nowrap;border:1px solid transparent;border-bottom:none;margin-bottom:-1px}
.tbtn:hover{color:var(--text);background:var(--surface-2)}
.tbtn.on{color:var(--blue);background:var(--bg);border-color:var(--border)}

.tc{flex:1;overflow-y:auto;padding:24px}
.tp{display:none}
.tp.on{display:block}

/* Page header */
.ph{margin-bottom:20px}
.ph-title{font-size:18px;font-weight:700;margin-bottom:4px}
.ph-desc{font-size:13px;color:var(--muted);max-width:640px}
.ph-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-size:13px;font-weight:600;transition:all .15s;border:none;cursor:pointer}
.btn-p{background:var(--blue);color:#fff}
.btn-p:hover{background:var(--blue-h)}
.btn-g{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.btn-g:hover{color:var(--text);border-color:var(--muted)}
.btn-d{background:var(--red-d);color:var(--red);border:1px solid transparent}
.btn-d:hover{border-color:var(--red)}
.btn-s{padding:5px 11px;font-size:12px}

/* Table */
.tw{overflow-x:auto;border-radius:var(--rl);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th{background:var(--surface);padding:10px 14px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(59,130,246,.03)}
.tda{display:flex;gap:6px}

/* Cards */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:18px;display:flex;flex-direction:column;gap:12px}
.card:hover{border-color:var(--surface-3)}
.ct{font-size:14px;font-weight:700}
.chook{font-size:13px;color:var(--blue);font-style:italic;line-height:1.5;border-left:2px solid var(--blue);padding-left:10px}
.cbody{font-size:13px;color:var(--muted);line-height:1.6}
.ctags{display:flex;gap:6px;flex-wrap:wrap}
.cft{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--border)}
.cac{display:flex;gap:6px}

/* Badges */
.b{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.bb{background:var(--blue-d);color:var(--blue)}
.bg{background:var(--green-d);color:var(--green)}
.br{background:var(--red-d);color:var(--red)}
.by{background:var(--yellow-d);color:var(--yellow)}
.bp{background:rgba(167,139,250,.1);color:var(--purple)}
.bm{background:var(--surface-2);color:var(--muted)}

/* CTA Bank */
.cta-grp{margin-bottom:26px}
.cta-grp-hdr{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.cta-list{display:flex;flex-direction:column;gap:8px}
.cta-it{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;transition:border-color .15s}
.cta-it.used{border-color:var(--blue);background:var(--blue-d)}
.cta-tx{flex:1;font-size:13px;line-height:1.5}
.cta-ac{display:flex;gap:6px;flex-shrink:0}
.cta-add-row{display:flex;gap:8px;margin-top:10px}
.cta-add-row input{flex:1}

/* Scripts */
.sbody{font-size:13px;line-height:1.7;color:var(--muted);white-space:pre-wrap;background:var(--surface-2);border-radius:var(--r);padding:14px}
.sbody .ph{color:var(--blue);background:var(--blue-d);padding:0 4px;border-radius:3px}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kcol{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:14px;min-height:160px}
.kch{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.kcnt{background:var(--surface-2);padding:1px 8px;border-radius:20px;font-size:11px}
.kcol[data-s=Idea] .kch{color:var(--blue)}
.kcol[data-s=Scripted] .kch{color:var(--yellow)}
.kcol[data-s=Filmed] .kch{color:var(--purple)}
.kcol[data-s=Posted] .kch{color:var(--green)}
.kcard{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.kcard:hover{border-color:var(--blue)}
.kct{font-size:13px;font-weight:600;margin-bottom:5px}
.kch2{font-size:12px;color:var(--blue);font-style:italic;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kcft{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}

/* Gaps */
.git{display:flex;align-items:flex-start;gap:12px;padding:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;max-width:720px}
.git.done{opacity:.4}
.git.done .gtx{text-decoration:line-through}
.gck{width:18px;height:18px;accent-color:var(--blue);cursor:pointer;flex-shrink:0;margin-top:2px}
.gtx{flex:1;font-size:13px;line-height:1.5}
.gadd{display:flex;gap:8px;margin-top:12px;max-width:720px}
.gadd input{flex:1}

/* Detail panel */
.dpanel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:20px;margin-top:16px;max-width:700px;display:flex;flex-direction:column;gap:14px}
.dlbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}

/* Tip */
.tip{background:var(--blue-d);border:1px solid rgba(59,130,246,.2);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.tip strong{color:var(--blue)}

/* Modal */
.bdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;align-items:center;justify-content:center;padding:20px}
.bdrop.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.mttl{font-size:15px;font-weight:700}
.mbdy{padding:20px;display:flex;flex-direction:column;gap:14px}
.mft{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ff{display:flex;flex-direction:column}

/* Swatches */
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s}
.sw.on{border-color:#fff;transform:scale(1.15)}

/* Empty */
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:13px}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--blue);color:var(--text);padding:10px 18px;border-radius:var(--r);font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* Import textarea */
.imp-ta{font-family:monospace;font-size:12px;min-height:140px}

@media(max-width:900px){.kanban{grid-template-columns:1fr 1fr}.frow{grid-template-columns:1fr}}
@media(max-width:640px){.kanban{grid-template-columns:1fr}.cg{grid-template-columns:1fr}.tc{padding:14px}table th:nth-child(n+5),table td:nth-child(n+5){display:none}}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">

    <div class="hdr-right">

      <span class="hdr-saved" id="last-saved">Not yet saved</span>

  </div>
  <div class="cbar">
    <div class="cbar-label">Client</div>
    <div class="cbar-btns" id="cbar"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="tc" id="tc"></div>
</div>

<div class="bdrop" id="bdrop">
  <div class="modal">
    <div class="mhd"><div class="mttl" id="mttl"></div><button class="btn btn-g btn-s" onclick="closeModal()">✕</button></div>
    <div class="mbdy" id="mbdy"></div>
    <div class="mft"><button class="btn btn-g" onclick="closeModal()">Cancel</button><button class="btn btn-p" id="msave">Save</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

    // ── CL1 REELS ──
    {id:'rl1',clientId:'cl1',coachHandle:'@trackclubbabe',followers:362000,views:0,viralityScore:0,format:'Talking Head',topic:'Transformation',hookText:'"I ran a 6:08 marathon. Then I changed one thing. Three years later: 3:11."',scriptSummary:'Personal transformation hook → the one change (not more miles, smarter miles) → 3 specific shifts she made → mirror the viewer: "if you feel stuck, this is why" → CTA for training plan.',ctaWording:'Grab my free training plan at the link in my bio',link:'',dateAdded:'2026-05-03'},

    {id:'rl6',clientId:'cl2',coachHandle:'@joecorcione',followers:13000,views:0,viralityScore:0,format:'Talking Head',topic:'Transformation',hookText:'"She came to me with zero running background at 51. 8 months later she crossed the finish line of a 50-miler."',scriptSummary:'Client transformation story. Before: never run more than 5k. Journey: 3 runs/week, built to back-to-backs. Result: 50-mile finish.',ctaWording:'DM me FIRST and I\'ll send you the exact 6-month progression we used',link:'',dateAdded:'2026-05-03'},
    {id:'rl7',clientId:'cl2',coachHandle:'@mr.ultrarunner',followers:180000,views:0,viralityScore:0,format:'Talking Head',topic:'Training Tips',hookText:'"The #1 mistake I see in first-time 100-mile runners — and it\'s not what you think."',scriptSummary:'Counterintuitive claim. Problem: most think DNFs are fitness failures. Truth: pacing in miles 1–30. Solution: run first quarter embarrassingly easy.',ctaWording:'Comment your race distance and I\'ll DM you the exact pace formula I use',link:'',dateAdded:'2026-05-03'},

// ── STATE ─────────────────────────────────────
const S=(()=>{
  let d=null;
  function load(){
    const raw=localStorage.getItem('ird_v4');
    if(raw){
      d=JSON.parse(raw);
      if(!d.clients)d.clients=JSON.parse(JSON.stringify(DEFAULTS.clients));
      ['coaches','reels','ctaBank','scripts','contentIdeas','contentGaps'].forEach(s=>{
        (d[s]||[]).forEach(x=>{if(!x.clientId)x.clientId='cl2'});
      });
    } else {
      // migrate from old keys
      const old=localStorage.getItem('ur_dashboard_v3')||localStorage.getItem('ur_dashboard');
      if(old){
        d=JSON.parse(old);
        if(!d.clients)d.clients=JSON.parse(JSON.stringify(DEFAULTS.clients));
        ['coaches','reels','ctaBank','scripts','contentIdeas','contentGaps'].forEach(s=>{
          (d[s]||[]).forEach(x=>{if(!x.clientId)x.clientId='cl2'});
        });
      } else {
        d=JSON.parse(JSON.stringify(DEFAULTS));
      }
    }
  }
  function save(){
    d.meta.lastSaved=new Date().toISOString();
    localStorage.setItem('ird_v4',JSON.stringify(d));
    const el=document.getElementById('last-saved');
    if(el)el.textContent='Saved '+new Date().toLocaleTimeString();
  }
  function get(k){return d[k]}
  function upsert(sec,item){const i=d[sec].findIndex(x=>x.id===item.id);if(i>=0)d[sec][i]=item;else d[sec].unshift(item);save()}
  function del(sec,id){d[sec]=d[sec].filter(x=>x.id!==id);save()}
  function tog(sec,id,f){const x=d[sec].find(x=>x.id===id);if(x){x[f]=!x[f];save()}}
  function setF(sec,id,f,v){const x=d[sec].find(x=>x.id===id);if(x){x[f]=v;save()}}
  return{load,save,get,upsert,del,tog,setF};
})();

// ── UTILS ─────────────────────────────────────
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(n){if(!n)return'—';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n)}
function vir(views,fol){if(!fol)return 0;return+((views/fol)*100).toFixed(1)}
function vBadge(s){
  if(!s)return'<span class="b bm">—</span>';
  if(s>=200)return`<span class="b br">🔥 ${s}% MEGA</span>`;
  if(s>=50)return`<span class="b bg">⚡ ${s}% Viral</span>`;
  if(s>=10)return`<span class="b bb">${s}% Good</span>`;
  return`<span class="b bm">${s}%</span>`;
}
function sBadge(s){const m={Idea:'bb',Scripted:'by',Filmed:'bp',Posted:'bg'};return`<span class="b ${m[s]||'bm'}">${s}</span>`}
function ctaBadge(t){const m={DM:'bg','Link in Bio':'bp',Comment:'by',Save:'bb',Follow:'bm','Direct Offer':'br'};return`<span class="b ${m[t]||'bm'}">${t}</span>`}
async function cp(text,btn){
  try{
    if(navigator.clipboard)await navigator.clipboard.writeText(text);
    else{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)}
    if(btn){const o=btn.textContent;btn.textContent='✓ Copied!';setTimeout(()=>btn.textContent=o,1500)}
    toast('Copied!');
  }catch{toast('Copy failed')}
}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2200)}
function hlPh(t){return esc(t).replace(/\[([^\]]+)\]/g,'<span class="ph">[$1]</span>')}

function buildFields(fields,init){
  const rows=[];let buf=[];
  fields.forEach((f,i)=>{
    const el=buildF(f,init[f.k]);
    if(f.half){buf.push(el);if(buf.length===2||i===fields.length-1){rows.push(`<div class="frow">${buf.join('')}</div>`);buf=[]}}
    else{if(buf.length){rows.push(`<div class="frow">${buf.join('')}</div>`);buf=[]}rows.push(`<div class="ff">${el}</div>`)}
  });
  return rows.join('');
}
function buildF(f,val){
  const v=val!=null?val:(f.def||'');
  let inp='';
  if(f.type==='textarea')inp=`<textarea data-f="${f.k}" rows="3">${esc(v)}</textarea>`;
  else if(f.type==='select'){
    const opts=f.opts.map((o,i)=>`<option value="${esc(f.vals?f.vals[i]:o)}" ${(f.vals?f.vals[i]:o)===v?'selected':''}>${esc(o)}</option>`).join('');
    inp=`<select data-f="${f.k}">${opts}</select>`;
  }
  else if(f.type==='number')inp=`<input type="number" data-f="${f.k}" value="${esc(String(v))}" min="0">`;
  else if(f.readonly)inp=`<input type="text" data-f="${f.k}" value="${esc(v)}" readonly style="opacity:.5;pointer-events:none">`;
  else inp=`<input type="text" data-f="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
  return`<div class="ff"><label>${esc(f.label)}</label>${inp}</div>`;
}
function attachCalc(){

  ['avgViews','views','followers'].forEach(k=>b.querySelector(`[data-f="${k}"]`)?.addEventListener('input',upd));
}

  const coaches=forC(S.get('coaches'));
  return`<div class="ph"><div class="ph-title">Competitor Coaches</div><div class="ph-desc">Track what other coaches are doing — audience size, what they offer, and how they get leads from Reels.</div><div class="ph-actions"><button class="btn btn-p" onclick="addCoach()">+ Add Coach</button><span style="font-size:12px;color:var(--muted)">${coaches.length} coaches tracked</span></div></div>
  <div class="tw"><table><thead><tr><th>Handle</th><th>Followers</th><th>Avg Views</th><th>Virality</th><th>What They Sell</th><th>Lead Gen Method</th>${activeClient==='all'?'<th>Client</th>':''}<th>Notes</th><th></th></tr></thead><tbody>
  ${coaches.length?coaches.map(c=>`<tr>
    <td><a href="https://instagram.com/${c.handle.replace('@','')}" target="_blank" style="font-weight:600">${esc(c.handle)}</a></td>
    <td>${fmt(c.followers)}</td><td>${fmt(c.avgViews)}</td><td>${vBadge(c.viralityScore)}</td>
    <td><span class="b bm">${esc(c.offerType)}</span></td><td>${ctaBadge(c.ctaType)}</td>
    ${activeClient==='all'?`<td>${cBadge(c.clientId)}</td>`:''}
    <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px">${esc(c.notes)}</td>
    <td><div class="tda"><button class="btn btn-g btn-s" onclick="editCoach('${c.id}')">Edit</button><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('coaches','${c.id}'),renderTab('Coaches')">✕</button></div></td>
  </tr>`).join(''):`<tr><td colspan="9"><div class="empty">No coaches yet. Click "+ Add Coach" to start.</div></td></tr>`}
  </tbody></table></div>`;
}
function addCoach(){openModal('Add Coach',coachF(),data=>{data.id=uid();data.createdAt=new Date().toISOString().slice(0,10);data.viralityScore=vir(data.avgViews,data.followers);S.upsert('coaches',data);renderTab('Coaches')})}
function editCoach(id){const c=S.get('coaches').find(x=>x.id===id);openModal('Edit Coach',coachF(),data=>{data.id=id;data.createdAt=c.createdAt;data.viralityScore=vir(data.avgViews,data.followers);S.upsert('coaches',data);renderTab('Coaches')},c)}

// ── REELS ─────────────────────────────────────
function reelF(){return[cf(),
  {k:'coachHandle',label:'Coach Handle',ph:'@username',half:true},
  {k:'followers',label:'Their Followers',type:'number',half:true},
  {k:'views',label:'Views',type:'number',half:true},
  {k:'viralityScore',label:'Virality (auto)',readonly:true,half:true},
  {k:'format',label:'Video Format',type:'select',half:true,opts:['Talking Head','B-roll + Voiceover','Text on Screen','Tutorial / Demo','Transformation','Mixed']},
  {k:'topic',label:'Topic',type:'select',half:true,opts:['Training Tips','Race Strategy','Transformation','Nutrition','Mindset','Gear','Q&A','Behind the Scenes','Controversial Take','Other']},
  {k:'hookText',label:'Opening Hook — exact words',type:'textarea'},
  {k:'scriptSummary',label:'Script Summary',type:'textarea'},
  {k:'ctaWording',label:'Call to Action — exact words',type:'textarea'},
  {k:'link',label:'Reel URL',ph:'https://instagram.com/reel/...'},
]}
function renderReels(){
  const all=forC(S.get('reels'));
  const topics=[...new Set(all.map(r=>r.topic))].filter(Boolean);
  const tF=document.getElementById('rf-t')?.value||'';
  const reels=all.filter(r=>!tF||r.topic===tF);
  return`<div class="ph"><div class="ph-title">Reels Research</div><div class="ph-desc">Top-performing Reels you've found — hooks, scripts, and CTAs worth learning from.</div><div class="ph-actions"><button class="btn btn-p" onclick="addReel()">+ Add Reel</button><select id="rf-t" onchange="renderTab('Reels')" style="max-width:170px"><option value="">All Topics</option>${topics.map(t=>`<option value="${esc(t)}" ${t===tF?'selected':''}>${esc(t)}</option>`).join('')}</select><span style="font-size:12px;color:var(--muted)">${reels.length} reels</span></div></div>
  <div class="cg">${reels.length?reels.map(r=>`<div class="card"><div class="ctags">${vBadge(r.viralityScore)}<span class="b bm">${esc(r.format||'—')}</span><span class="b bb">${esc(r.topic||'—')}</span>${cBadge(r.clientId)}</div><div class="chook">"${esc(r.hookText)}"</div><div><div style="font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:5px">Script</div><div class="cbody">${esc(r.scriptSummary)}</div></div><div><div style="font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:5px">Call to Action</div><div style="font-size:13px;color:var(--blue);line-height:1.5">${esc(r.ctaWording)}</div></div><div class="cft"><div style="font-size:12px;color:var(--muted)">${esc(r.coachHandle||'Unknown coach')}</div><div class="cac">${r.link?`<a href="${esc(r.link)}" target="_blank" class="btn btn-g btn-s">View ↗</a>`:''}<button class="btn btn-g btn-s" onclick="editReel('${r.id}')">Edit</button><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('reels','${r.id}'),renderTab('Reels')">✕</button></div></div></div>`).join(''):'<div class="empty">No reels yet. Add one to start building your research.</div>'}</div>`;
}
function addReel(){openModal('Add Reel',reelF(),data=>{data.id=uid();data.dateAdded=new Date().toISOString().slice(0,10);data.viralityScore=vir(data.views,data.followers);S.upsert('reels',data);renderTab('Reels')})}
function editReel(id){const r=S.get('reels').find(x=>x.id===id);openModal('Edit Reel',reelF(),data=>{data.id=id;data.dateAdded=r.dateAdded;data.viralityScore=vir(data.views,data.followers);S.upsert('reels',data);renderTab('Reels')},r)}

// ── CTA BANK ──────────────────────────────────
function renderCTABank(){
  const ctas=forC(S.get('ctaBank'));
  const used=ctas.filter(c=>c.usedIt).length;
  let h=`<div class="ph"><div class="ph-title">CTA Bank</div><div class="ph-desc">Ready-to-use calls to action. Copy one and use it in your next Reel.</div></div><div class="tip"><strong>Tip:</strong> DM CTAs convert at 12–25%. Link in Bio converts at 1.5–3%. Use DM CTAs whenever possible. &nbsp;·&nbsp; ${used}/${ctas.length} CTAs used so far.</div>`;
  CTA_TYPES.forEach(type=>{
    const items=ctas.filter(c=>c.type===type);
    const safe=type.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9-]/g,'');
    h+=`<div class="cta-grp"><div class="cta-grp-hdr"><span style="color:${CTA_C[type]||'var(--text)'}">▸ ${type}</span><span style="font-weight:400">${items.filter(c=>c.usedIt).length}/${items.length} used &nbsp;<button class="btn btn-g btn-s" onclick="showCtaForm('${safe}')">+ Add</button></span></div><div class="cta-list">${items.map(c=>`<div class="cta-it ${c.usedIt?'used':''}"><div class="cta-tx">${cBadge(c.clientId)} ${esc(c.text)}</div><div class="cta-ac"><button class="btn btn-g btn-s" onclick="cp('${esc(c.text.replace(/'/g,"\\'"))}',this)">Copy</button><button class="btn btn-g btn-s" onclick="S.tog('ctaBank','${c.id}','usedIt');renderTab('CTA Bank')">${c.usedIt?'✓ Used':'Used It'}</button><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('ctaBank','${c.id}'),renderTab('CTA Bank')">✕</button></div></div>`).join('')||`<div style="font-size:13px;color:var(--muted);padding:8px 0">None yet — click "+ Add".</div>`}</div><div class="cta-add-row" id="ca-${safe}" style="display:none"><input id="ci-${safe}" type="text" placeholder="Type your ${esc(type)} CTA..." onkeydown="if(event.key==='Enter')saveCTA('${safe}','${esc(type)}')"><button class="btn btn-p btn-s" onclick="saveCTA('${safe}','${esc(type)}')">Add</button><button class="btn btn-g btn-s" onclick="document.getElementById('ca-${safe}').style.display='none'">✕</button></div></div>`;
  });
  return h;
}
function showCtaForm(safe){const el=document.getElementById(`ca-${safe}`);if(el){el.style.display='flex';el.querySelector('input')?.focus()}}
function saveCTA(safe,type){
  const inp=document.getElementById(`ci-${safe}`);
  if(!inp||!inp.value.trim())return;
  const cid=activeClient!=='all'?activeClient:(S.get('clients')[0]?.id||'');
  S.upsert('ctaBank',{id:uid(),clientId:cid,type,text:inp.value.trim(),usedIt:false});
  renderTab('CTA Bank');
}

// ── SCRIPTS ───────────────────────────────────
function scriptF(){return[cf(),
  {k:'title',label:'Script Name',ph:'e.g. The Mistake Hook',half:true},
  {k:'type',label:'Type',type:'select',half:true,opts:['Mistake','Transformation','Contrarian','Q&A','Stats / Data','Day in the Life','Tutorial','Other']},
  {k:'templateText',label:'Script — use [BRACKETS] for parts to fill in',type:'textarea'},
  {k:'notes',label:'When to use this script',type:'textarea'},
]}
function renderScripts(){
  const scripts=forC(S.get('scripts'));
  return`<div class="ph"><div class="ph-title">Script Templates</div><div class="ph-desc">Fill-in-the-blank scripts. Click "Copy with Blanks" to grab one — then fill in the brackets.</div><div class="ph-actions"><button class="btn btn-p" onclick="addScript()">+ Add Script</button></div></div>
  <div class="cg">${scripts.map(s=>`<div class="card"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><div class="ct">${esc(s.title)}</div><span class="b bb">${esc(s.type)}</span>${cBadge(s.clientId)}</div><pre class="sbody">${hlPh(s.templateText)}</pre>${s.notes?`<div class="cbody" style="border-top:1px solid var(--border);padding-top:10px;font-size:12px"><strong style="color:var(--muted)">WHEN TO USE:</strong> ${esc(s.notes)}</div>`:''}<div class="cft"><div class="cac"><button class="btn btn-p btn-s" onclick="cp(S.get('scripts').find(x=>x.id==='${s.id}').templateText.replace(/\\[([^\\]]+)\\]/g,'______'),this)">Copy with Blanks</button><button class="btn btn-g btn-s" onclick="cp(S.get('scripts').find(x=>x.id==='${s.id}').templateText,this)">Copy Template</button><button class="btn btn-g btn-s" onclick="editScript('${s.id}')">Edit</button><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('scripts','${s.id}'),renderTab('Scripts')">✕</button></div></div></div>`).join('')||'<div class="empty">No scripts yet.</div>'}</div>`;
}
function addScript(){openModal('Add Script',scriptF(),data=>{data.id=uid();S.upsert('scripts',data);renderTab('Scripts')})}
function editScript(id){const s=S.get('scripts').find(x=>x.id===id);openModal('Edit Script',scriptF(),data=>{data.id=id;S.upsert('scripts',data);renderTab('Scripts')},s)}

// ── CONTENT IDEAS ─────────────────────────────
function ideaF(){return[cf(),
  {k:'title',label:'Idea Title',ph:'e.g. The DNF Reframe'},
  {k:'hook',label:'Opening Hook — the first line that stops the scroll',type:'textarea'},
  {k:'scriptOutline',label:'Script Outline',type:'textarea'},
  {k:'ctaRecommendation',label:'Call to Action',type:'textarea'},
  {k:'status',label:'Stage',type:'select',opts:['Idea','Scripted','Filmed','Posted']},
]}
function renderContentIdeas(){
  const ideas=forC(S.get('contentIdeas'));
  const cols=KCOLS.map(status=>{
    const items=ideas.filter(i=>i.status===status);
    return`<div class="kcol" data-s="${status}"><div class="kch">${status}<span class="kcnt">${items.length}</span></div>${items.map(i=>`<div class="kcard" onclick="openIdea('${i.id}')"><div class="kct">${esc(i.title)}</div><div class="kch2">"${esc(i.hook)}"</div><div class="kcft">${cBadge(i.clientId)}<select class="btn btn-g btn-s" onclick="event.stopPropagation()" onchange="S.setF('contentIdeas','${i.id}','status',this.value);renderTab('Content Ideas')" style="width:auto;padding:3px 8px">${KCOLS.map(s=>`<option ${s===i.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn btn-d btn-s" onclick="event.stopPropagation();if(confirm('Delete?'))S.del('contentIdeas','${i.id}'),renderTab('Content Ideas')">✕</button></div></div>`).join('')||`<div style="font-size:12px;color:var(--muted);padding:6px 0">Empty</div>`}</div>`;
  }).join('');
  return`<div class="ph"><div class="ph-title">Content Ideas</div><div class="ph-desc">Move ideas through the pipeline. Click any card to see the full hook, script outline, and CTA.</div><div class="ph-actions"><button class="btn btn-p" onclick="addIdea()">+ Add Idea</button><span style="font-size:12px;color:var(--muted)">${ideas.filter(i=>i.status==='Posted').length} posted · ${ideas.length} total</span></div></div><div class="kanban">${cols}</div><div id="idea-detail"></div>`;
}
function openIdea(id){
  const i=S.get('contentIdeas').find(x=>x.id===id);if(!i)return;
  const el=document.getElementById('idea-detail');if(!el)return;
  el.innerHTML=`<div class="dpanel"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div style="font-size:16px;font-weight:700">${esc(i.title)}</div>${sBadge(i.status)} ${cBadge(i.clientId)}</div><div><div class="dlbl">Opening Hook</div><div class="chook">"${esc(i.hook)}"</div></div><div><div class="dlbl">Script Outline</div><div class="cbody" style="white-space:pre-wrap">${esc(i.scriptOutline)}</div></div><div><div class="dlbl">Call to Action</div><div style="font-size:13px;color:var(--blue);line-height:1.5">${esc(i.ctaRecommendation)}</div></div><div class="cft"><button class="btn btn-p btn-s" onclick="cp(${JSON.stringify(i.hook+'\n\n'+i.scriptOutline+'\n\nCTA: '+i.ctaRecommendation)},this)">Copy Full Brief</button><button class="btn btn-g btn-s" onclick="editIdea('${i.id}')">Edit</button><button class="btn btn-g btn-s" onclick="document.getElementById('idea-detail').innerHTML=''">Close</button></div></div>`;
}
function addIdea(){openModal('Add Content Idea',ideaF(),data=>{data.id=uid();data.createdAt=new Date().toISOString().slice(0,10);S.upsert('contentIdeas',data);renderTab('Content Ideas')})}
function editIdea(id){const i=S.get('contentIdeas').find(x=>x.id===id);openModal('Edit Idea',ideaF(),data=>{data.id=id;data.createdAt=i.createdAt;S.upsert('contentIdeas',data);renderTab('Content Ideas')},i)}

// ── GAPS ──────────────────────────────────────
function renderGaps(){
  const gaps=forC(S.get('contentGaps'));
  const open=gaps.filter(g=>!g.covered).length,done=gaps.filter(g=>g.covered).length;
  return`<div class="ph"><div class="ph-title">Content Gaps</div><div class="ph-desc">Topics your audience wants that competitors aren't covering. Tick them off as you make content for each.</div><div class="ph-actions">${done?`<button class="btn btn-g" onclick="clearGaps()">Clear Completed (${done})</button>`:''}<span style="font-size:12px;color:var(--muted)">${open} open · ${done} covered</span></div></div><div class="tip"><strong>Opportunity:</strong> Each unchecked gap is a Reel idea your competitors aren't making. Start with whichever your audience mentions most.</div>${gaps.map(g=>`<div class="git ${g.covered?'done':''}"><input type="checkbox" class="gck" ${g.covered?'checked':''} onchange="S.tog('contentGaps','${g.id}','covered');renderTab('Gaps')"><div class="gtx">${cBadge(g.clientId)} ${esc(g.topic)}</div><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('contentGaps','${g.id}'),renderTab('Gaps')">✕</button></div>`).join('')||'<div class="empty">No gaps yet — add one below.</div>'}<div class="gadd"><input id="gap-inp" type="text" placeholder="Describe a topic your audience wants that nobody's covering..." onkeydown="if(event.key==='Enter')saveGap()"><button class="btn btn-p" onclick="saveGap()">Add Gap</button></div>`;
}
function saveGap(){
  const inp=document.getElementById('gap-inp');if(!inp||!inp.value.trim())return;
  const cid=activeClient!=='all'?activeClient:(S.get('clients')[0]?.id||'');
  S.upsert('contentGaps',{id:uid(),clientId:cid,topic:inp.value.trim(),covered:false});renderTab('Gaps');
}
function clearGaps(){
  const all=S.get('contentGaps'),keep=all.filter(g=>!g.covered||(activeClient!=='all'&&g.clientId!==activeClient));
  all.length=0;keep.forEach(x=>all.push(x));S.save();renderTab('Gaps');
}

// ── ROUTER ────────────────────────────────────
const RENDERERS={'Coaches':renderCoaches,'Reels':renderReels,'CTA Bank':renderCTABank,'Scripts':renderScripts,'Content Ideas':renderContentIdeas,'Gaps':renderGaps};
let activeTab=TABS[0];
function renderTab(name){
  activeTab=name;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  document.querySelectorAll('.tp').forEach(p=>p.classList.toggle('on',p.id===`tp-${TID[name]}`));
  const panel=document.getElementById(`tp-${TID[name]}`);
  if(panel)panel.innerHTML=RENDERERS[name]()||'';
}

// ── INIT ──────────────────────────────────────
function init(){
  S.load();
  renderCBar();
  document.getElementById('tabs').innerHTML=TABS.map(t=>`<button class="tbtn ${t===activeTab?'on':''}" data-tab="${t}" onclick="renderTab('${t}')">${t}</button>`).join('');
  document.getElementById('tc').innerHTML=TABS.map(t=>`<div class="tp ${t===activeTab?'on':''}" id="tp-${TID[t]}"></div>`).join('');
  renderTab(activeTab);
  const saved=S.get('meta').lastSaved;
  if(saved)document.getElementById('last-saved').textContent='Last saved '+new Date(saved).toLocaleString();
}
init();
</script>
</body>
</html>
