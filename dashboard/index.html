<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Research Dashboard</title>
<style>
:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface-2: #273548;
  --surface-3: #2f3f55;
  --border: #334155;
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --blue: #3b82f6;
  --blue-hover: #2563eb;
  --blue-dim: rgba(59,130,246,0.12);
  --green: #22c55e;
  --green-dim: rgba(34,197,94,0.1);
  --red: #f87171;
  --red-dim: rgba(248,113,113,0.1);
  --yellow: #fbbf24;
  --yellow-dim: rgba(251,191,36,0.1);
  --purple: #a78bfa;
  --r: 8px;
  --r-lg: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.6; }
button { cursor: pointer; border: none; background: none; font-family: inherit; font-size: inherit; color: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r); padding: 9px 12px; width: 100%; outline: none; transition: border-color .15s; }
input:focus, textarea:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-dim); }
textarea { resize: vertical; min-height: 80px; }
select option { background: var(--surface-2); }
label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── App shell ── */
#app { display: flex; flex-direction: column; height: 100vh; }

/* ── Header ── */
.header { padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.header-title { font-size: 16px; font-weight: 800; letter-spacing: -.3px; }
.header-title .blue { color: var(--blue); }
.header-saved { font-size: 12px; color: var(--text-muted); }

/* ── Client switcher ── */
.client-section { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; flex-shrink: 0; }
.client-label { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
.client-switcher { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.client-btn { display: flex; align-items: center; gap: 9px; padding: 9px 18px; border-radius: 30px; border: 2px solid var(--border); color: var(--text-muted); font-size: 13px; font-weight: 600; transition: all .18s; background: none; }
.client-btn:hover { border-color: var(--text-muted); color: var(--text); }
.client-btn.active { color: #fff; border-color: transparent; }
.client-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.client-count { font-size: 11px; opacity: .7; background: rgba(0,0,0,.25); padding: 1px 7px; border-radius: 20px; }
.client-btn .del { opacity: 0; font-size: 12px; margin-left: 2px; line-height: 1; }
.client-btn:hover .del { opacity: .6; }
.client-btn .del:hover { opacity: 1; }
.add-client-btn { display: flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 30px; border: 2px dashed var(--border); color: var(--text-muted); font-size: 13px; font-weight: 600; transition: all .18s; }
.add-client-btn:hover { border-color: var(--blue); color: var(--blue); }

/* ── Tabs ── */
.tabs { display: flex; gap: 2px; padding: 12px 24px 0; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; overflow-x: auto; }
.tabs::-webkit-scrollbar { height: 0; }
.tab-btn { padding: 8px 18px; border-radius: var(--r) var(--r) 0 0; font-size: 13px; font-weight: 600; color: var(--text-muted); transition: all .15s; white-space: nowrap; border: 1px solid transparent; border-bottom: none; margin-bottom: -1px; }
.tab-btn:hover { color: var(--text); background: var(--surface-2); }
.tab-btn.active { color: var(--blue); background: var(--bg); border-color: var(--border); }

/* ── Tab content ── */
.tab-content { flex: 1; overflow-y: auto; padding: 24px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Page header ── */
.page-header { margin-bottom: 20px; }
.page-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.page-desc { font-size: 13px; color: var(--text-muted); }
.page-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 14px; }

/* ── Buttons ── */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--r); font-size: 13px; font-weight: 600; transition: all .15s; border: none; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-hover); }
.btn-ghost { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }
.btn-danger { background: var(--red-dim); color: var(--red); border: 1px solid transparent; }
.btn-danger:hover { border-color: var(--red); }
.btn-sm { padding: 5px 11px; font-size: 12px; }

/* ── Cards ── */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.card:hover { border-color: var(--surface-3); }
.card-title { font-size: 14px; font-weight: 700; }
.card-hook { font-size: 13px; color: var(--blue); font-style: italic; line-height: 1.5; border-left: 2px solid var(--blue); padding-left: 10px; }
.card-body { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
.card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.card-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--border); }
.card-actions { display: flex; gap: 6px; }

/* ── Table ── */
.table-wrap { overflow-x: auto; border-radius: var(--r-lg); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; }
th { background: var(--surface); padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(59,130,246,0.03); }
.td-actions { display: flex; gap: 6px; }

/* ── Badges ── */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.badge-blue { background: var(--blue-dim); color: var(--blue); }
.badge-green { background: var(--green-dim); color: var(--green); }
.badge-red { background: var(--red-dim); color: var(--red); }
.badge-yellow { background: var(--yellow-dim); color: var(--yellow); }
.badge-purple { background: rgba(167,139,250,0.1); color: var(--purple); }
.badge-muted { background: var(--surface-2); color: var(--text-muted); }

/* ── CTA Bank ── */
.cta-group { margin-bottom: 28px; }
.cta-group-title { font-size: 12px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text-muted); padding-bottom: 10px; border-bottom: 1px solid var(--border); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.cta-list { display: flex; flex-direction: column; gap: 8px; }
.cta-item { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; transition: border-color .15s; }
.cta-item.used { border-color: var(--blue); background: var(--blue-dim); }
.cta-item-text { flex: 1; font-size: 13px; line-height: 1.5; }
.cta-item-actions { display: flex; gap: 6px; flex-shrink: 0; }
.cta-add-row { display: flex; gap: 8px; margin-top: 10px; }
.cta-add-row input { flex: 1; }

/* ── Script template ── */
.script-body { font-size: 13px; line-height: 1.7; color: var(--text-muted); white-space: pre-wrap; background: var(--surface-2); border-radius: var(--r); padding: 14px; }
.script-body .ph { color: var(--blue); background: var(--blue-dim); padding: 0 4px; border-radius: 3px; }

/* ── Kanban ── */
.kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.k-col { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px; min-height: 200px; }
.k-col-header { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.k-count { background: var(--surface-2); padding: 1px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.k-col[data-s="Idea"] .k-col-header { color: var(--blue); }
.k-col[data-s="Scripted"] .k-col-header { color: var(--yellow); }
.k-col[data-s="Filmed"] .k-col-header { color: var(--purple); }
.k-col[data-s="Posted"] .k-col-header { color: var(--green); }
.k-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s; }
.k-card:hover { border-color: var(--blue); }
.k-card-title { font-size: 13px; font-weight: 600; margin-bottom: 5px; }
.k-card-hook { font-size: 12px; color: var(--blue); font-style: italic; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.k-card-footer { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }

/* ── Gaps ── */
.gap-item { display: flex; align-items: flex-start; gap: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 8px; max-width: 720px; }
.gap-item.done { opacity: .4; }
.gap-item.done .gap-text { text-decoration: line-through; }
.gap-check { width: 18px; height: 18px; accent-color: var(--blue); cursor: pointer; flex-shrink: 0; margin-top: 2px; }
.gap-text { flex: 1; font-size: 13px; line-height: 1.5; }
.gap-add { display: flex; gap: 8px; margin-top: 12px; max-width: 720px; }
.gap-add input { flex: 1; }

/* ── Detail panel ── */
.detail-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px; margin-top: 16px; max-width: 700px; display: flex; flex-direction: column; gap: 14px; }
.detail-label { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px; }

/* ── Modal ── */
.backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
.backdrop.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); }
.modal-title { font-size: 15px; font-weight: 700; }
.modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-field { display: flex; flex-direction: column; }

/* ── Color swatches ── */
.swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all .15s; }
.swatch.on { border-color: #fff; transform: scale(1.15); }

/* ── Tip box ── */
.tip { background: var(--blue-dim); border: 1px solid rgba(59,130,246,.2); border-radius: var(--r); padding: 12px 14px; font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
.tip strong { color: var(--blue); }

/* ── Empty ── */
.empty { text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 13px; }

/* ── Toast ── */
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--blue); color: var(--text); padding: 10px 18px; border-radius: var(--r); font-size: 13px; z-index: 200; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

/* ── Status badge colors ── */
.s-idea { background: var(--blue-dim); color: var(--blue); }
.s-scripted { background: var(--yellow-dim); color: var(--yellow); }
.s-filmed { background: rgba(167,139,250,0.1); color: var(--purple); }
.s-posted { background: var(--green-dim); color: var(--green); }

@media (max-width: 900px) {
  .kanban { grid-template-columns: 1fr 1fr; }
  .form-row { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .kanban { grid-template-columns: 1fr; }
  .cards-grid { grid-template-columns: 1fr; }
  .tab-content { padding: 14px; }
  table th:nth-child(n+5), table td:nth-child(n+5) { display: none; }
}
</style>
</head>

// STATE

const State = (() => {
  let d = null;
  function load() {
    const raw = localStorage.getItem('ur_dashboard_v3');
    if (raw) {
      d = JSON.parse(raw);
      if (!d.clients) d.clients = JSON.parse(JSON.stringify(DEFAULTS.clients));
      ['coaches','reels','ctaBank','scripts','contentIdeas','contentGaps'].forEach(s => {
        (d[s] || []).forEach(x => { if (!x.clientId) x.clientId = 'cl2'; });
      });
    } else {
      // try migrating from old key
      const old = localStorage.getItem('ur_dashboard');
      if (old) {
        d = JSON.parse(old);
        if (!d.clients) d.clients = JSON.parse(JSON.stringify(DEFAULTS.clients));
        ['coaches','reels','ctaBank','scripts','contentIdeas','contentGaps'].forEach(s => {
          (d[s] || []).forEach(x => { if (!x.clientId) x.clientId = 'cl2'; });
        });
      } else {
        d = JSON.parse(JSON.stringify(DEFAULTS));
      }
    }
  }
  function save() {
    d.meta.lastSaved = new Date().toISOString();
    localStorage.setItem('ur_dashboard_v3', JSON.stringify(d));
    const el = document.getElementById('last-saved');
    if (el) el.textContent = 'Saved at ' + new Date().toLocaleTimeString();
  }
  function get(k) { return d[k]; }
  function upsert(section, item) {
    const i = d[section].findIndex(x => x.id === item.id);
    if (i >= 0) d[section][i] = item; else d[section].unshift(item);
    save();
  }
  function del(section, id) { d[section] = d[section].filter(x => x.id !== id); save(); }
  function toggle(section, id, field) { const x = d[section].find(x => x.id === id); if (x) { x[field] = !x[field]; save(); } }
  function setF(section, id, field, val) { const x = d[section].find(x => x.id === id); if (x) { x[field] = val; save(); } }
  return { load, save, get, upsert, del, toggle, setF };
})();

function renderClientSwitcher() {
  const clients = State.get('clients');

function delClient(id) {
  if (!confirm(`Remove "${clientName(id)}"? Their data stays but won't be linked to a client.`)) return;
  const arr = State.get('clients').filter(x => x.id !== id);
  State.get('clients').length = 0; arr.forEach(x => State.get('clients').push(x));
  State.save();
  if (activeClient === id) activeClient = 'all';
  renderClientSwitcher(); renderTab(activeTab);
}

function uid() { return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n) { if (!n) return '—'; if (n>=1e6) return (n/1e6).toFixed(1)+'M'; if (n>=1e3) return (n/1e3).toFixed(1)+'K'; return String(n); }
function virality(views, followers) { if (!followers) return 0; return +((views/followers)*100).toFixed(1); }
function viralBadge(s) {
  if (!s) return '<span class="badge badge-muted">—</span>';
  if (s>=200) return `<span class="badge badge-red">🔥 ${s}% MEGA</span>`;
  if (s>=50)  return `<span class="badge badge-green">⚡ ${s}% Viral</span>`;
  if (s>=10)  return `<span class="badge badge-blue">${s}% Good</span>`;
  return `<span class="badge badge-muted">${s}%</span>`;
}
function statusBadge(s) {
  const m = {Idea:'s-idea',Scripted:'s-scripted',Filmed:'s-filmed',Posted:'s-posted'};
  return `<span class="badge ${m[s]||'badge-muted'}">${s}</span>`;
}
function ctaBadge(t) {
  const m = {DM:'badge-green','Link in Bio':'badge-purple',Comment:'badge-yellow',Save:'badge-blue',Follow:'badge-muted','Direct Offer':'badge-red'};
  return `<span class="badge ${m[t]||'badge-muted'}">${t}</span>`;
}
async function cp(text, btn) {
  try {
    if (navigator.clipboard) await navigator.clipboard.writeText(text);
    else { const ta=document.createElement('textarea'); ta.value=text; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
    if (btn) { const o=btn.textContent; btn.textContent='✓ Copied!'; setTimeout(()=>btn.textContent=o,1500); }
    toast('Copied!');
  } catch { toast('Copy failed — select manually'); }
}
function toast(msg) {
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}
function hlPh(text) {
  return esc(text).replace(/\[([^\]]+)\]/g, '<span class="ph">[$1]</span>');
}

let _onSave = null;

function openModal(title, fields, onSave, initial, extraHtml) {
  _onSave = onSave;
  document.getElementById('modal-title').textContent = title;
  const body = document.getElementById('modal-body');
  body.innerHTML = (extraHtml||'') + buildFields(fields, initial||{});
  attachCalc();
  document.getElementById('backdrop').classList.add('open');
  body.querySelector('input,textarea,select')?.focus();
}
function closeModal() { document.getElementById('backdrop').classList.remove('open'); _onSave=null; }
document.getElementById('modal-save').addEventListener('click', () => {
  if (!_onSave) return;
  const data = {};
  document.querySelectorAll('#modal-body [data-f]').forEach(el => {
    data[el.dataset.f] = el.type==='number' ? (parseFloat(el.value)||0) : el.value;
  });
  _onSave(data); closeModal();
});
document.getElementById('backdrop').addEventListener('click', e => { if(e.target.id==='backdrop') closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

function buildFields(fields, init) {
  const rows = []; let buf = [];
  fields.forEach((f, i) => {
    const el = buildField(f, init[f.k]);
    if (f.half) { buf.push(el); if (buf.length===2||i===fields.length-1) { rows.push(`<div class="form-row">${buf.join('')}</div>`); buf=[]; } }
    else { if (buf.length) { rows.push(`<div class="form-row">${buf.join('')}</div>`); buf=[]; } rows.push(`<div class="form-field">${el}</div>`); }
  });
  return rows.join('');
}
function buildField(f, val) {
  const v = val!=null ? val : (f.def||'');
  let input='';
  if (f.type==='textarea') input=`<textarea data-f="${f.k}" rows="3">${esc(v)}</textarea>`;
  else if (f.type==='select') {
    const opts = f.opts.map((o,i) => `<option value="${esc(f.vals?f.vals[i]:o)}" ${(f.vals?f.vals[i]:o)===v?'selected':''}>${esc(o)}</option>`).join('');
    input=`<select data-f="${f.k}">${opts}</select>`;
  } else if (f.type==='number') input=`<input type="number" data-f="${f.k}" value="${esc(String(v))}" min="0">`;
  else if (f.readonly) input=`<input type="text" data-f="${f.k}" value="${esc(v)}" readonly style="opacity:.5;pointer-events:none">`;
  else input=`<input type="text" data-f="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
  return `<div class="form-field"><label>${esc(f.label)}</label>${input}</div>`;
}
function attachCalc() {
  const b=document.getElementById('modal-body');
  const upd=()=>{ const v=b.querySelector('[data-f="avgViews"],[data-f="views"]'),f=b.querySelector('[data-f="followers"]'),s=b.querySelector('[data-f="viralityScore"]'); if(v&&f&&s) s.value=virality(parseFloat(v.value)||0,parseFloat(f.value)||0); };
  ['avgViews','views','followers'].forEach(k=>b.querySelector(`[data-f="${k}"]`)?.addEventListener('input',upd));
}

            <div style="font-size:13px;color:var(--blue);line-height:1.5">${esc(r.ctaWording)}</div>
          </div>
          <div class="card-footer">
            <div style="font-size:12px;color:var(--text-muted)">${esc(r.coachHandle||'Unknown coach')}</div>
            <div class="card-actions">
              ${r.link?`<a href="${esc(r.link)}" target="_blank" class="btn btn-ghost btn-sm">View Reel ↗</a>`:''}
              <button class="btn btn-ghost btn-sm" onclick="editReel('${r.id}')">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="if(confirm('Delete?'))State.del('reels','${r.id}'),renderTab('Reels')">✕</button>
            </div>
          </div>
        </div>`).join('')
      : '<div class="empty">No reels yet. Add one above to start building your research library.</div>'}
    </div>`;
}

function reelFields() {
  return [cf(),
    {k:'coachHandle', label:'Coach Handle', ph:'@username', half:true},
    {k:'followers', label:'Coach Followers', type:'number', half:true},
    {k:'views', label:'Views', type:'number', half:true},
    {k:'viralityScore', label:'Virality Score (auto)', readonly:true, half:true},
    {k:'format', label:'Video Format', type:'select', half:true, opts:['Talking Head','B-roll + Voiceover','Text on Screen','Tutorial / Demo','Transformation','Mixed']},
    {k:'topic', label:'Topic', type:'select', half:true, opts:['Training Tips','Race Strategy','Transformation','Nutrition','Mindset','Gear','Q&A','Behind the Scenes','Controversial Take','Other']},
    {k:'hookText', label:'Hook — exact opening line', type:'textarea'},
    {k:'scriptSummary', label:'Script Summary', type:'textarea'},
    {k:'ctaWording', label:'Call to Action — exact wording', type:'textarea'},
    {k:'link', label:'Reel URL (optional)', ph:'https://instagram.com/reel/...'},
  ];
}
function addReel() {
  openModal('Add Reel', reelFields(), data => {
    data.id=uid(); data.dateAdded=new Date().toISOString().slice(0,10);
    data.viralityScore=virality(data.views,data.followers);
    State.upsert('reels',data); renderTab('Reels');
  });
}
function editReel(id) {
  const r=State.get('reels').find(x=>x.id===id);
  openModal('Edit Reel', reelFields(), data => {
    data.id=id; data.dateAdded=r.dateAdded;
    data.viralityScore=virality(data.views,data.followers);
    State.upsert('reels',data); renderTab('Reels');
  }, r);
}

// ─────────────────────────────────────────────
// TAB: CTA BANK
// ─────────────────────────────────────────────
function renderCTABank() {
  const ctas = forClient(State.get('ctaBank'));
  const used = ctas.filter(c=>c.usedIt).length;
  let html = `
    <div class="page-header">
      <div class="page-title">CTA Bank</div>
      <div class="page-desc">Ready-to-use calls to action. Copy any CTA and use it in your next Reel. Mark it as "Used" to track what's been deployed.</div>
    </div>
    <div class="tip"><strong>Tip:</strong> DM CTAs convert at 12–25%. Link in Bio converts at 1.5–3%. Use DM CTAs whenever possible. &nbsp;·&nbsp; ${used}/${ctas.length} CTAs used so far.</div>`;

  CTA_TYPES.forEach(type => {
    const items = ctas.filter(c=>c.type===type);
    const safe = type.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9-]/g,'');
    html += `
      <div class="cta-group">
        <div class="cta-group-title">
          <span style="color:${CTA_COLORS[type]||'var(--text)'}">▸ ${type}</span>
          <span style="font-weight:400">${items.filter(c=>c.usedIt).length}/${items.length} used &nbsp;
            <button class="btn btn-ghost btn-sm" onclick="showCTAForm('${safe}')">+ Add</button>
          </span>
        </div>
        <div class="cta-list">
          ${items.map(c=>`
            <div class="cta-item ${c.usedIt?'used':''}">
              <div class="cta-item-text">${clientBadge(c.clientId)} ${esc(c.text)}</div>
              <div class="cta-item-actions">
                <button class="btn btn-ghost btn-sm" onclick="cp('${esc(c.text.replace(/'/g,"\\'"))}',this)">Copy</button>
                <button class="btn btn-ghost btn-sm" onclick="State.toggle('ctaBank','${c.id}','usedIt');renderTab('CTA Bank')" title="${c.usedIt?'Mark unused':'Mark as used'}">${c.usedIt?'✓ Used':'Used It'}</button>
                <button class="btn btn-danger btn-sm" onclick="if(confirm('Delete?'))State.del('ctaBank','${c.id}'),renderTab('CTA Bank')">✕</button>
              </div>
            </div>`).join('') || `<div style="font-size:13px;color:var(--text-muted);padding:8px 0">None yet — click "+ Add" above.</div>`}
        </div>
        <div class="cta-add-row" id="cta-add-${safe}" style="display:none">
          <input id="cta-inp-${safe}" type="text" placeholder="Type your ${type} CTA here..." onkeydown="if(event.key==='Enter')saveCTA('${safe}','${esc(type)}')">
          <button class="btn btn-primary btn-sm" onclick="saveCTA('${safe}','${esc(type)}')">Add</button>
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('cta-add-${safe}').style.display='none'">✕</button>
        </div>
      </div>`;
  });
  return html;
}
function showCTAForm(safe) { const el=document.getElementById(`cta-add-${safe}`); if(el){el.style.display='flex'; el.querySelector('input')?.focus();} }
function saveCTA(safe, type) {
  const inp=document.getElementById(`cta-inp-${safe}`);
  if(!inp||!inp.value.trim()) return;
  const clients=State.get('clients');
  const clientId=activeClient!=='all'?activeClient:(clients[0]?.id||'');
  State.upsert('ctaBank',{id:uid(),clientId,type,text:inp.value.trim(),usedIt:false});
  renderTab('CTA Bank');
}

// ─────────────────────────────────────────────
// TAB: SCRIPTS
// ─────────────────────────────────────────────
function renderScripts() {
  const scripts = forClient(State.get('scripts'));
  return `
    <div class="page-header">
      <div class="page-title">Script Templates</div>
      <div class="page-desc">Fill-in-the-blank scripts based on the highest-converting Reels patterns. Click "Copy" to grab one and fill in the brackets.</div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick="addScript()">+ Add Script</button>
      </div>
    </div>
    <div class="cards-grid">
      ${scripts.map(s=>`
        <div class="card">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <div class="card-title">${esc(s.title)}</div>
            <span class="badge badge-blue">${esc(s.type)}</span>
            ${clientBadge(s.clientId)}
          </div>
          <pre class="script-body">${hlPh(s.templateText)}</pre>
          ${s.notes?`<div class="card-body" style="border-top:1px solid var(--border);padding-top:10px;font-size:12px"><strong style="color:var(--text-muted)">WHEN TO USE:</strong> ${esc(s.notes)}</div>`:''}
          <div class="card-footer">
            <div class="card-actions">
              <button class="btn btn-primary btn-sm" onclick="cp(State.get('scripts').find(x=>x.id==='${s.id}').templateText.replace(/\\[([^\\]]+)\\]/g,'______'),this)">Copy with Blanks</button>
              <button class="btn btn-ghost btn-sm" onclick="cp(State.get('scripts').find(x=>x.id==='${s.id}').templateText,this)">Copy Template</button>
              <button class="btn btn-ghost btn-sm" onclick="editScript('${s.id}')">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="if(confirm('Delete?'))State.del('scripts','${s.id}'),renderTab('Scripts')">✕</button>
            </div>
          </div>
        </div>`).join('')||'<div class="empty">No scripts yet.</div>'}
    </div>`;
}
function scriptFields() {
  return [cf(),
    {k:'title', label:'Script Name', ph:'e.g. The Mistake Hook', half:true},
    {k:'type', label:'Type', type:'select', half:true, opts:['Mistake','Transformation','Contrarian','Q&A','Stats / Data','Day in the Life','Tutorial','Other']},
    {k:'templateText', label:'Script — use [BRACKETS] for fill-in parts', type:'textarea'},
    {k:'notes', label:'When to use this script', type:'textarea'},
  ];
}
function addScript() {
  openModal('Add Script Template', scriptFields(), data => {
    data.id=uid(); State.upsert('scripts',data); renderTab('Scripts');
  });
}
function editScript(id) {
  const s=State.get('scripts').find(x=>x.id===id);
  openModal('Edit Script', scriptFields(), data => {
    data.id=id; State.upsert('scripts',data); renderTab('Scripts');
  }, s);
}

// ─────────────────────────────────────────────
// TAB: CONTENT IDEAS
// ─────────────────────────────────────────────
function renderContentIdeas() {
  const ideas = forClient(State.get('contentIdeas'));
  const cols = KANBAN_COLS.map(status => {
    const items = ideas.filter(i=>i.status===status);
    return `
      <div class="k-col" data-s="${status}">
        <div class="k-col-header">${status} <span class="k-count">${items.length}</span></div>
        ${items.map(i=>`
          <div class="k-card" onclick="openIdeaDetail('${i.id}')">
            <div class="k-card-title">${esc(i.title)}</div>
            <div class="k-card-hook">"${esc(i.hook)}"</div>
            <div class="k-card-footer">
              ${clientBadge(i.clientId)}
              <select class="btn btn-ghost btn-sm" onclick="event.stopPropagation()" onchange="State.setF('contentIdeas','${i.id}','status',this.value);renderTab('Content Ideas')" style="width:auto;padding:3px 8px">
                ${KANBAN_COLS.map(s=>`<option ${s===i.status?'selected':''}>${s}</option>`).join('')}
              </select>
              <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();if(confirm('Delete?'))State.del('contentIdeas','${i.id}'),renderTab('Content Ideas')">✕</button>
            </div>
          </div>`).join('')||`<div style="font-size:12px;color:var(--text-muted);padding:6px 0">Empty</div>`}
      </div>`;
  }).join('');

  return `
    <div class="page-header">
      <div class="page-title">Content Ideas</div>
      <div class="page-desc">Move ideas through the pipeline — from idea to posted. Click any card to see the full hook, script, and CTA.</div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick="addIdea()">+ Add Idea</button>
        <span style="font-size:12px;color:var(--text-muted)">${ideas.filter(i=>i.status==='Posted').length} posted · ${ideas.length} total</span>
      </div>
    </div>
    <div class="kanban">${cols}</div>
    <div id="idea-detail"></div>`;
}

function openIdeaDetail(id) {
  const i=State.get('contentIdeas').find(x=>x.id===id);
  if(!i) return;
  const el=document.getElementById('idea-detail');
  if(!el) return;
  el.innerHTML=`
    <div class="detail-panel">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div style="font-size:16px;font-weight:700">${esc(i.title)}</div>
        ${statusBadge(i.status)} ${clientBadge(i.clientId)}
      </div>
      <div><div class="detail-label">Opening Hook</div><div class="card-hook">"${esc(i.hook)}"</div></div>
      <div><div class="detail-label">Script Outline</div><div class="card-body" style="white-space:pre-wrap">${esc(i.scriptOutline)}</div></div>
      <div><div class="detail-label">Call to Action</div><div style="font-size:13px;color:var(--blue);line-height:1.5">${esc(i.ctaRecommendation)}</div></div>
      <div class="card-footer">
        <button class="btn btn-primary btn-sm" onclick="cp(${JSON.stringify(i.hook+'\n\n'+i.scriptOutline+'\n\nCTA: '+i.ctaRecommendation)},this)">Copy Full Brief</button>
        <button class="btn btn-ghost btn-sm" onclick="editIdea('${i.id}')">Edit</button>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('idea-detail').innerHTML=''">Close</button>
      </div>
    </div>`;
}
function ideaFields() {
  return [cf(),
    {k:'title', label:'Idea Title', ph:'e.g. The DNF Reframe'},
    {k:'hook', label:'Opening Hook — first line (make it stop the scroll)', type:'textarea'},
    {k:'scriptOutline', label:'Script Outline', type:'textarea'},
    {k:'ctaRecommendation', label:'Call to Action', type:'textarea'},
    {k:'status', label:'Stage', type:'select', opts:['Idea','Scripted','Filmed','Posted']},
  ];
}
function addIdea() {
  openModal('Add Content Idea', ideaFields(), data => {
    data.id=uid(); data.createdAt=new Date().toISOString().slice(0,10);
    State.upsert('contentIdeas',data); renderTab('Content Ideas');
  });
}
function editIdea(id) {
  const i=State.get('contentIdeas').find(x=>x.id===id);
  openModal('Edit Idea', ideaFields(), data => {
    data.id=id; data.createdAt=i.createdAt;
    State.upsert('contentIdeas',data); renderTab('Content Ideas');
  }, i);
}

// ─────────────────────────────────────────────
// TAB: GAPS
// ─────────────────────────────────────────────
function renderGaps() {
  const gaps = forClient(State.get('contentGaps'));
  const open = gaps.filter(g=>!g.covered).length;
  const done = gaps.filter(g=>g.covered).length;
  return `
    <div class="page-header">
      <div class="page-title">Content Gaps</div>
      <div class="page-desc">Topics your audience wants that competitors aren't covering well. Tick them off as you create content for each one.</div>
      <div class="page-actions">
        ${done?`<button class="btn btn-ghost" onclick="clearDoneGaps()">Clear Completed (${done})</button>`:''}
        <span style="font-size:12px;color:var(--text-muted)">${open} open · ${done} covered</span>
      </div>
    </div>
    <div class="tip"><strong>Opportunity:</strong> Each unchecked gap below is a Reel idea that your competitors aren't making. Start with the one your audience mentions most.</div>
    ${gaps.map(g=>`
      <div class="gap-item ${g.covered?'done':''}">
        <input type="checkbox" class="gap-check" ${g.covered?'checked':''} onchange="State.toggle('contentGaps','${g.id}','covered');renderTab('Gaps')">
        <div class="gap-text">${clientBadge(g.clientId)} ${esc(g.topic)}</div>
        <button class="btn btn-danger btn-sm" onclick="if(confirm('Delete?'))State.del('contentGaps','${g.id}'),renderTab('Gaps')">✕</button>
      </div>`).join('')||'<div class="empty">No gaps recorded yet — add one below.</div>'}
    <div class="gap-add">
      <input id="gap-inp" type="text" placeholder="Describe a topic your audience wants but isn't being covered..." onkeydown="if(event.key==='Enter')saveGap()">
      <button class="btn btn-primary" onclick="saveGap()">Add Gap</button>
    </div>`;
}
function saveGap() {
  const inp=document.getElementById('gap-inp');
  if(!inp||!inp.value.trim()) return;
  const clients=State.get('clients');
  const clientId=activeClient!=='all'?activeClient:(clients[0]?.id||'');
  State.upsert('contentGaps',{id:uid(),clientId,topic:inp.value.trim(),covered:false});
  renderTab('Gaps');
}
function clearDoneGaps() {
  const all=State.get('contentGaps');
  const keep=all.filter(g=>!g.covered||(activeClient!=='all'&&g.clientId!==activeClient));
  all.length=0; keep.forEach(x=>all.push(x)); State.save(); renderTab('Gaps');
}

// ─────────────────────────────────────────────
// ROUTER
// ─────────────────────────────────────────────
const RENDERERS = { 'Coaches':renderCoaches,'Reels':renderReels,'CTA Bank':renderCTABank,'Scripts':renderScripts,'Content Ideas':renderContentIdeas,'Gaps':renderGaps };
let activeTab = TABS[0];

function renderTab(name) {
  activeTab = name;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id===`panel-${TAB_IDS[name]}`));
  const panel = document.getElementById(`panel-${TAB_IDS[name]}`);
  if (panel) panel.innerHTML = RENDERERS[name]?.() || '';
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
function init() {
  State.load();
  renderClientSwitcher();

  document.getElementById('tabs').innerHTML = TABS.map(t=>
    `<button class="tab-btn ${t===activeTab?'active':''}" data-tab="${t}" onclick="renderTab('${t}')">${t}</button>`
  ).join('');

  document.getElementById('tab-content').innerHTML = TABS.map(t=>
    `<div class="tab-panel ${t===activeTab?'active':''}" id="panel-${TAB_IDS[t]}"></div>`
  ).join('');

  renderTab(activeTab);

  const saved = State.get('meta').lastSaved;
  if (saved) document.getElementById('last-saved').textContent = 'Last saved ' + new Date(saved).toLocaleString();
}

init();
</script>
</body>
</html>
