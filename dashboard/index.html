<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreatorHub</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:#f5f5f5;color:#111}
button{cursor:pointer;border:none;background:none;font-family:inherit;font-size:inherit;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:#111;background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:8px 11px;width:100%;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
textarea{resize:vertical;min-height:72px}
select option{background:#fff}
label{display:block;font-size:11px;color:#6b7280;margin-bottom:4px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
a{color:#3b82f6;text-decoration:none}a:hover{text-decoration:underline}

#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

.sb-logo{padding:18px 16px 14px;font-size:13px;font-weight:800;letter-spacing:-.2px;border-bottom:1px solid #e5e7eb}
.sb-logo span{color:#3b82f6}
.sb-sec{padding:10px 10px 4px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#9ca3af}
.cb{display:flex;align-items:center;gap:10px;width:calc(100% - 8px);margin:1px 4px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#374151;transition:all .14s;text-align:left}
.cb:hover{background:#f3f4f6}.cb.active{background:#eff6ff;color:#1d4ed8}
.cav{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.chdl{font-size:11px;font-weight:400;color:#9ca3af;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb.active .chdl{color:#93c5fd}
.sb-add{display:flex;align-items:center;gap:8px;width:calc(100% - 8px);margin:1px 4px;padding:8px 12px;border-radius:8px;color:#9ca3af;font-size:13px;border:1.5px dashed #e5e7eb;transition:all .14s}
.sb-add:hover{border-color:#3b82f6;color:#3b82f6}
.sb-div{border-top:1px solid #e5e7eb;margin:8px 12px}
.sbn{display:flex;align-items:center;gap:8px;width:calc(100% - 8px);margin:1px 4px;padding:8px 12px;border-radius:8px;color:#6b7280;font-size:13px;font-weight:500;transition:all .14s;text-align:left}
.sbn:hover{background:#f9fafb;color:#111}.sbn.active{background:#f0fdf4;color:#15803d;font-weight:600}

.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-l{display:flex;align-items:center;gap:10px}
.page-title{font-size:15px;font-weight:700}
.ctag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.topbar-r{display:flex;align-items:center;gap:8px}
.srv{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.srv.on{background:#dcfce7;color:#15803d}.srv.off{background:#f3f4f6;color:#9ca3af}
.srv-dot{width:7px;height:7px;border-radius:50%}
.srv.on .srv-dot{background:#22c55e}.srv.off .srv-dot{background:#d1d5db}

.tabs{display:flex;border-bottom:1px solid #e5e7eb;background:#fff;padding:0 24px;flex-shrink:0;overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tbtn{padding:12px 16px;font-size:13px;font-weight:500;color:#6b7280;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:all .14s}
.tbtn:hover{color:#111}.tbtn.on{color:#1d4ed8;border-bottom-color:#3b82f6;font-weight:600}

.tc{flex:1;overflow-y:auto;padding:24px;background:#f9fafb}
.tp{display:none}.tp.on{display:block}

.ph{margin-bottom:20px}
.ph-title{font-size:17px;font-weight:700;margin-bottom:3px}
.ph-desc{font-size:13px;color:#6b7280;max-width:600px;line-height:1.5}
.ph-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;transition:all .14s;cursor:pointer;border:none}
.btn-p{background:#3b82f6;color:#fff}.btn-p:hover{background:#2563eb}
.btn-g{background:#fff;color:#374151;border:1px solid #d1d5db}.btn-g:hover{background:#f9fafb;border-color:#9ca3af}
.btn-d{background:#fff;color:#ef4444;border:1px solid #fecaca}.btn-d:hover{background:#fef2f2}
.btn-gen{background:#111;color:#fff}.btn-gen:hover{background:#374151}
.btn-big{padding:12px 24px;font-size:14px;font-weight:700;border-radius:8px}
.btn-s{padding:4px 10px;font-size:12px}

/* Analyse tab */
.analyse-wrap{max-width:680px}
.coach-pick{display:flex;gap:10px;margin-bottom:24px}
.coach-card{flex:1;border:2px solid #e5e7eb;border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .15s;background:#fff}
.coach-card:hover{border-color:#d1d5db}
.coach-card.selected{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 8%,white)}
.coach-card-name{font-size:14px;font-weight:700;margin-bottom:2px}
.coach-card-hdl{font-size:12px;color:#9ca3af}
.comp-input-row{display:flex;gap:8px;margin-bottom:12px}
.comp-input-row input{flex:1}
.comp-list{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;min-height:20px}
.comp-tag{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e5e7eb;border-radius:7px;padding:9px 12px}
.comp-tag-h{flex:1;font-size:13px;font-weight:600;color:#111}
.comp-tag-sub{font-size:11px;color:#9ca3af}
.analyse-cta{background:#111;color:#fff;border-radius:10px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;transition:background .15s}
.analyse-cta:hover{background:#1f2937}
.analyse-cta-l{font-size:15px;font-weight:700}
.analyse-cta-sub{font-size:12px;color:#9ca3af;margin-top:2px}
.analyse-cta-r{font-size:22px;flex-shrink:0}
.empty-comp{font-size:13px;color:#9ca3af;padding:16px 0;text-align:center;border:1.5px dashed #e5e7eb;border-radius:8px}
.qty-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.qty-btn{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;border:1.5px solid #e5e7eb;background:#fff;color:#6b7280;transition:all .14s;cursor:pointer}
.qty-btn.on{border-color:#3b82f6;background:#eff6ff;color:#1d4ed8}
.step-label{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#9ca3af;margin-bottom:8px}

/* Cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card:hover{border-color:#d1d5db;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-hook{font-size:13px;color:#1d4ed8;font-style:italic;line-height:1.5;border-left:3px solid #3b82f6;padding-left:10px}
.card-body{font-size:13px;color:#6b7280;line-height:1.6}
.card-cta{font-size:12px;color:#15803d;background:#f0fdf4;padding:6px 10px;border-radius:6px;border:1px solid #bbf7d0;line-height:1.5}
.card-footer{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid #f3f4f6;flex-wrap:wrap;gap:6px}
.card-actions{display:flex;gap:5px;flex-wrap:wrap}

.b{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-blue{background:#dbeafe;color:#1d4ed8}.b-green{background:#dcfce7;color:#15803d}
.b-yellow{background:#fef9c3;color:#a16207}.b-purple{background:#f3e8ff;color:#7e22ce}
.b-gray{background:#f3f4f6;color:#374151}.b-red{background:#fee2e2;color:#b91c1c}
.b-orange{background:#fff7ed;color:#c2410c}

.tw{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:#f9fafb;padding:9px 14px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #e5e7eb;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #f3f4f6;vertical-align:middle;font-size:13px}
tr:last-child td{border-bottom:none}tr:hover td{background:#fafafa}
.tda{display:flex;gap:5px}

.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.kcol{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px;min-height:140px}
.kch{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#6b7280;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.kcnt{background:#f3f4f6;padding:1px 7px;border-radius:20px;font-size:11px;color:#6b7280}
.kcol[data-s=Idea] .kch{color:#3b82f6}.kcol[data-s=Scripted] .kch{color:#d97706}
.kcol[data-s=Filmed] .kch{color:#7c3aed}.kcol[data-s=Posted] .kch{color:#15803d}
.kcard{background:#f9fafb;border:1px solid #e5e7eb;border-radius:7px;padding:10px;margin-bottom:6px;cursor:pointer;transition:all .14s}
.kcard:hover{border-color:#3b82f6;background:#eff6ff}
.kct{font-size:13px;font-weight:600;color:#111;margin-bottom:4px}
.kchook{font-size:11px;color:#3b82f6;font-style:italic;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:5px;line-height:1.4}
.kcta{font-size:11px;color:#15803d;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kcft{margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:5px;flex-wrap:wrap}
.ksrc{font-size:10px;color:#9ca3af;margin-top:3px}

.idea-detail{background:#fff;border:1px solid #3b82f6;border-radius:10px;padding:20px;margin-top:14px;display:flex;flex-direction:column;gap:14px}
.idea-detail-hdr{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px}
.dlbl{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#9ca3af;margin-bottom:5px}
.script-box{font-size:12px;line-height:1.7;color:#374151;white-space:pre-wrap;background:#f9fafb;border:1px solid #e5e7eb;border-radius:7px;padding:12px;font-family:monospace}
.script-box .ph-hl{color:#1d4ed8;background:#dbeafe;padding:0 3px;border-radius:3px;font-family:monospace}
.cta-box{background:#f0fdf4;border:1px solid #86efac;border-radius:7px;padding:10px 14px;font-size:13px;color:#15803d;line-height:1.5}
.src-box{background:#fff7ed;border:1px solid #fed7aa;border-radius:7px;padding:10px 14px;font-size:12px;color:#9a3412;line-height:1.5}

.cta-grp{margin-bottom:22px}
.cta-grp-hdr{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#6b7280;padding-bottom:8px;border-bottom:1px solid #e5e7eb;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.cta-list{display:flex;flex-direction:column;gap:6px}
.cta-it{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e5e7eb;border-radius:7px;padding:10px 12px;transition:all .14s}
.cta-it.used{border-color:#86efac;background:#f0fdf4}
.cta-tx{flex:1;font-size:13px;line-height:1.4;color:#111}
.cta-ac{display:flex;gap:5px;flex-shrink:0}
.cta-add-row{display:flex;gap:7px;margin-top:8px}.cta-add-row input{flex:1}

.gap-item{display:flex;align-items:flex-start;gap:10px;padding:11px;background:#fff;border:1px solid #e5e7eb;border-radius:7px;margin-bottom:6px;max-width:680px}
.gap-item.done{opacity:.4}.gap-item.done .gap-tx{text-decoration:line-through}
.gck{width:16px;height:16px;accent-color:#3b82f6;cursor:pointer;flex-shrink:0;margin-top:2px}
.gap-tx{flex:1;font-size:13px;line-height:1.5;color:#111}
.gadd{display:flex;gap:7px;margin-top:10px;max-width:680px}.gadd input{flex:1}

.tip{background:#eff6ff;border:1px solid #bfdbfe;border-radius:7px;padding:10px 14px;font-size:13px;color:#374151;margin-bottom:16px;line-height:1.6}
.tip strong{color:#1d4ed8}
.empty{text-align:center;padding:40px 20px;color:#9ca3af;font-size:13px}

.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.stat{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px}
.stat-n{font-size:24px;font-weight:800;color:#111;line-height:1}
.stat-l{font-size:12px;color:#6b7280;margin-top:4px}

.bdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.bdrop.on{display:flex}
.modal{background:#fff;border:1px solid #e5e7eb;border-radius:14px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #e5e7eb}
.mttl{font-size:15px;font-weight:700;color:#111}
.mbdy{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.mft{padding:14px 20px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:8px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ff{display:flex;flex-direction:column}
.swatches{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.sw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .14s}
.sw.on{border-color:#111;transform:scale(1.15)}
.prompt-box{font-family:monospace;font-size:11px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:7px;padding:12px;line-height:1.6;color:#374151;white-space:pre-wrap;max-height:280px;overflow-y:auto}
.imp-ta{font-family:monospace;font-size:12px;min-height:110px}

.vir-hot{background:#fee2e2;color:#b91c1c}
.vir-good{background:#dcfce7;color:#15803d}
.vir-ok{background:#dbeafe;color:#1d4ed8}

.toast{position:fixed;bottom:20px;right:20px;background:#111;color:#fff;padding:9px 16px;border-radius:7px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media(max-width:900px){.kanban{grid-template-columns:1fr 1fr}.frow{grid-template-columns:1fr}.sidebar{width:180px}.coach-pick{flex-direction:column}}
@media(max-width:640px){.sidebar{display:none}.kanban{grid-template-columns:1fr}.tc{padding:14px}table th:nth-child(n+5),table td:nth-child(n+5){display:none}}
</style>
</head>
<body>
<div id="app">
  <div class="sidebar">
    <div class="sb-logo">Creator<span>Hub</span></div>
    <div style="padding:8px 4px 4px">
      <div class="sb-sec">Creators</div>
      <div id="creator-list"></div>
      <button class="sb-add" onclick="addClientModal()">+ Add Creator</button>
    </div>
    <div class="sb-div"></div>
    <div style="padding:4px">
      <div class="sb-sec">Workspace</div>
      <button class="sbn" id="nav-all" onclick="setClient('all');switchNav('all')">📊 All Creators</button>
      <button class="sbn" onclick="openImport()">⬇ Import Results</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-l">
        <span class="page-title" id="topbar-title">All Creators</span>
        <span id="topbar-tag"></span>
      </div>
      <div class="topbar-r">
        <span class="srv off" id="srv-badge"><span class="srv-dot"></span>Browser only</span>
        <span style="font-size:12px;color:#9ca3af" id="last-saved"></span>
        <button class="btn btn-g btn-s" onclick="openImport()">⬇ Import</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="tc" id="tc"></div>
  </div>
</div>

<div class="bdrop" id="bdrop">
  <div class="modal">
    <div class="mhd"><div class="mttl" id="mttl"></div><button class="btn btn-g btn-s" onclick="closeModal()">✕</button></div>
    <div class="mbdy" id="mbdy"></div>
    <div class="mft"><button class="btn btn-g" onclick="closeModal()">Cancel</button><button class="btn btn-p" id="msave">Save</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const PALETTE=['#3b82f6','#f97316','#10b981','#8b5cf6','#ec4899','#f59e0b','#06b6d4','#ef4444'];
const TABS=['Analyse','Content Pipeline','CTA Bank','Reels','Coaches','Gaps'];
const TID={Analyse:'analyse','Content Pipeline':'content','CTA Bank':'cta','Reels':'reels',Coaches:'coaches',Gaps:'gaps'};
const KCOLS=['Idea','Scripted','Filmed','Posted'];
const CTA_TYPES=['DM','Comment','Save','Link in Bio','Follow','Direct Offer'];

const DEFAULTS={
  clients:[
    {id:'cl1',name:'Nick Hancock',handle:'@runwithnick',color:'#3b82f6'},
    {id:'cl2',name:'Josh Laker',handle:'@joshc.laker',color:'#f97316'},
  ],
  coaches:[],reels:[],ctaBank:[],contentIdeas:[],contentGaps:[],
  meta:{version:7,lastSaved:null}
};

// ── STATE ────────────────────────────────────────
const S=(()=>{
  let d=null;
  const SERVER='http://localhost:8765';
  let serverUp=false;
  function setSrv(up){
    serverUp=up;
    const el=document.getElementById('srv-badge');if(!el)return;
    el.className='srv '+(up?'on':'off');
    el.innerHTML=`<span class="srv-dot"></span>${up?'Saved to file':'Browser only'}`;
  }
  async function pingServer(){try{const r=await fetch(SERVER+'/data',{signal:AbortSignal.timeout(600)});return r.ok}catch{return false}}
  async function load(){
    const up=await pingServer();setSrv(up);
    if(up){try{const r=await fetch(SERVER+'/data');const remote=await r.json();if(remote&&remote.meta){d=remote;localStorage.setItem('ird_v7',JSON.stringify(d));_updLabel();return}}catch{}}
    const raw=localStorage.getItem('ird_v7');
    if(raw){d=JSON.parse(raw);}
    else{d=JSON.parse(JSON.stringify(DEFAULTS));}
    if(!d.competitors)d.competitors={};
    if(up)_push();
  }
  function _push(){if(!serverUp)return;fetch(SERVER+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).catch(()=>{})}
  function _updLabel(){const el=document.getElementById('last-saved');if(el&&d.meta&&d.meta.lastSaved)el.textContent='Saved '+new Date(d.meta.lastSaved).toLocaleTimeString()}
  function save(){if(!d.meta)d.meta={version:7};d.meta.lastSaved=new Date().toISOString();localStorage.setItem('ird_v7',JSON.stringify(d));_push();const el=document.getElementById('last-saved');if(el)el.textContent='Saved '+new Date().toLocaleTimeString()}
  function get(k){return d[k]}
  function upsert(sec,item){if(!d[sec])d[sec]=[];const i=d[sec].findIndex(x=>x.id===item.id);if(i>=0)d[sec][i]=item;else d[sec].unshift(item);save()}
  function del(sec,id){d[sec]=d[sec].filter(x=>x.id!==id);save()}
  function tog(sec,id,f){const x=d[sec].find(x=>x.id===id);if(x){x[f]=!x[f];save()}}
  function setF(sec,id,f,v){const x=d[sec].find(x=>x.id===id);if(x){x[f]=v;save()}}
  return{load,save,get,upsert,del,tog,setF};
})();

// ── CLIENT ───────────────────────────────────────
let activeClient='all';
function setClient(id){activeClient=id;renderSidebar();renderTopbar();renderTab(activeTab)}
function forC(items){if(!items)return[];return activeClient==='all'?items:items.filter(x=>x.clientId===activeClient)}
function cColor(id){const c=(S.get('clients')||[]).find(x=>x.id===id);return c?c.color:'#6b7280'}
function cName(id){const c=(S.get('clients')||[]).find(x=>x.id===id);return c?c.name:''}
function cHandle(id){const c=(S.get('clients')||[]).find(x=>x.id===id);return c?c.handle||'':''}
function cBadge(id){if(activeClient!=='all')return'';const col=cColor(id),name=cName(id);if(!name)return'';return`<span class="b" style="background:${col}22;color:${col}">${esc(name)}</span>`}

function renderSidebar(){
  const clients=S.get('clients')||[];
  let h='';
  clients.forEach(c=>{
    const on=activeClient===c.id;

// ── UTILS ────────────────────────────────────────
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(n){if(!n)return'—';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n)}
function vir(v,f){if(!f)return 0;return+((v/f)*100).toFixed(1)}
function vBadge(s){if(!s)return'<span class="b b-gray">—</span>';if(s>=200)return`<span class="b vir-hot">🔥 ${s}%</span>`;if(s>=50)return`<span class="b vir-good">⚡ ${s}%</span>`;if(s>=10)return`<span class="b vir-ok">${s}%</span>`;return`<span class="b b-gray">${s}%</span>`}
function sBadge(s){const m={Idea:'b-blue',Scripted:'b-yellow',Filmed:'b-purple',Posted:'b-green'};return`<span class="b ${m[s]||'b-gray'}">${s}</span>`}
function ctaBadge(t){const m={DM:'b-green','Link in Bio':'b-purple',Comment:'b-yellow',Save:'b-blue',Follow:'b-gray','Direct Offer':'b-red'};return`<span class="b ${m[t]||'b-gray'}">${t}</span>`}
function hlPh(t){return esc(t).replace(/\[([^\]]+)\]/g,'<span class="ph-hl">[$1]</span>')}
async function cp(text,btn){try{if(navigator.clipboard)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)}if(btn){const o=btn.textContent;btn.textContent='✓ Copied!';setTimeout(()=>btn.textContent=o,1500)}toast('Copied!')}catch{toast('Copy failed')}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2300)}

let _onSave=null;
function openModal(title,fields,onSave,initial,extra){
  _onSave=onSave;document.getElementById('mttl').textContent=title;
  const b=document.getElementById('mbdy');b.innerHTML=(extra||'')+buildFields(fields,initial||{});
  attachCalc();document.getElementById('msave').textContent='Save';document.getElementById('msave').style.display='';
  document.getElementById('bdrop').classList.add('on');b.querySelector('input,textarea,select')?.focus();
}
function closeModal(){document.getElementById('bdrop').classList.remove('on');_onSave=null}
document.getElementById('msave').addEventListener('click',()=>{if(!_onSave)return;const data={};document.querySelectorAll('#mbdy [data-f]').forEach(el=>{data[el.dataset.f]=el.type==='number'?(parseFloat(el.value)||0):el.value});_onSave(data);closeModal()});
document.getElementById('bdrop').addEventListener('click',e=>{if(e.target.id==='bdrop')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function buildFields(fields,init){const rows=[];let buf=[];fields.forEach((f,i)=>{const el=buildF(f,init[f.k]);if(f.half){buf.push(el);if(buf.length===2||i===fields.length-1){rows.push(`<div class="frow">${buf.join('')}</div>`);buf=[]}}else{if(buf.length){rows.push(`<div class="frow">${buf.join('')}</div>`);buf=[]}rows.push(`<div class="ff">${el}</div>`)}});return rows.join('')}
function buildF(f,val){const v=val!=null?val:(f.def||'');let inp='';if(f.type==='textarea')inp=`<textarea data-f="${f.k}" rows="3">${esc(v)}</textarea>`;else if(f.type==='select'){const opts=f.opts.map((o,i)=>`<option value="${esc(f.vals?f.vals[i]:o)}" ${(f.vals?f.vals[i]:o)===v?'selected':''}>${esc(o)}</option>`).join('');inp=`<select data-f="${f.k}">${opts}</select>`}else if(f.type==='number')inp=`<input type="number" data-f="${f.k}" value="${esc(String(v))}" min="0">`;else if(f.readonly)inp=`<input type="text" data-f="${f.k}" value="${esc(v)}" readonly style="opacity:.5;pointer-events:none">`;else inp=`<input type="text" data-f="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;return`<div class="ff"><label>${esc(f.label)}</label>${inp}</div>`}
function attachCalc(){const b=document.getElementById('mbdy');const upd=()=>{const v=b.querySelector('[data-f="avgViews"],[data-f="views"]'),f=b.querySelector('[data-f="followers"]'),s=b.querySelector('[data-f="viralityScore"]');if(v&&f&&s)s.value=vir(parseFloat(v.value)||0,parseFloat(f.value)||0)};['avgViews','views','followers'].forEach(k=>b.querySelector(`[data-f="${k}"]`)?.addEventListener('input',upd))}
function cf(){const cl=S.get('clients')||[];return{k:'clientId',label:'Creator',type:'select',opts:cl.map(c=>c.name),vals:cl.map(c=>c.id),def:activeClient!=='all'?activeClient:(cl[0]?.id||'')}}

    <div><div class="dlbl">Call to Action</div><div class="cta-box">${esc(i.ctaRecommendation||'No CTA set')}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-p btn-s" onclick="cp(${JSON.stringify((i.hook||'')+'\n\n'+(i.scriptTemplate||i.scriptOutline||'')+'\n\nCTA: '+(i.ctaRecommendation||''))},this)">Copy Full Script</button>
      <button class="btn btn-g btn-s" onclick="editIdea('${i.id}')">Edit</button>
      <button class="btn btn-g btn-s" onclick="document.getElementById('idea-detail').innerHTML=''">Close</button>
    </div>
  </div>`;
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function addIdea(){openModal('Add Idea',ideaF(),d=>{d.id=uid();d.createdAt=new Date().toISOString().slice(0,10);S.upsert('contentIdeas',d);renderTab('Content Pipeline')})}
function editIdea(id){const i=(S.get('contentIdeas')||[]).find(x=>x.id===id);openModal('Edit Idea',ideaF(),d=>{d.id=id;d.createdAt=i.createdAt;S.upsert('contentIdeas',d);renderTab('Content Pipeline')},i)}

// ── CTA BANK ─────────────────────────────────────
function renderCTABank(){
  const ctas=forC(S.get('ctaBank')||[]);const used=ctas.filter(c=>c.usedIt).length;
  let h=`<div class="ph"><div class="ph-title">CTA Bank</div><div class="ph-desc">Ready-to-use calls to action. Copy straight into any script.</div></div>
  <div class="tip"><strong>DM CTAs convert at 12–25%.</strong> Link in Bio converts at 1.5–3%. &nbsp;·&nbsp; ${used}/${ctas.length} used.</div>`;
  CTA_TYPES.forEach(type=>{
    const items=ctas.filter(c=>c.type===type);
    const safe=type.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9-]/g,'');
    h+=`<div class="cta-grp"><div class="cta-grp-hdr"><span>${type}</span><span style="font-weight:400;color:#9ca3af">${items.filter(c=>c.usedIt).length}/${items.length} used &nbsp;<button class="btn btn-g btn-s" onclick="showCtaForm('${safe}')">+ Add</button></span></div>
    <div class="cta-list">${items.map(c=>`<div class="cta-it ${c.usedIt?'used':''}"><div class="cta-tx">${cBadge(c.clientId)} ${esc(c.text)}</div><div class="cta-ac"><button class="btn btn-g btn-s" onclick="cp('${esc(c.text.replace(/'/g,"\\'"))}',this)">Copy</button><button class="btn btn-g btn-s" onclick="S.tog('ctaBank','${c.id}','usedIt');renderTab('CTA Bank')">${c.usedIt?'✓ Used':'Mark Used'}</button><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('ctaBank','${c.id}'),renderTab('CTA Bank')">✕</button></div></div>`).join('')||`<div style="font-size:13px;color:#9ca3af;padding:6px 0">None yet.</div>`}</div>
    <div class="cta-add-row" id="ca-${safe}" style="display:none"><input id="ci-${safe}" type="text" placeholder="New ${esc(type)} CTA..." onkeydown="if(event.key==='Enter')saveCTA('${safe}','${esc(type)}')"><button class="btn btn-p btn-s" onclick="saveCTA('${safe}','${esc(type)}')">Add</button><button class="btn btn-g btn-s" onclick="document.getElementById('ca-${safe}').style.display='none'">✕</button></div></div>`;
  });return h;
}
function showCtaForm(safe){const el=document.getElementById(`ca-${safe}`);if(el){el.style.display='flex';el.querySelector('input')?.focus()}}
function saveCTA(safe,type){const inp=document.getElementById(`ci-${safe}`);if(!inp||!inp.value.trim())return;const cid=activeClient!=='all'?activeClient:((S.get('clients')||[])[0]?.id||'');S.upsert('ctaBank',{id:uid(),clientId:cid,type,text:inp.value.trim(),usedIt:false});renderTab('CTA Bank')}

// ── REELS ────────────────────────────────────────
function reelF(){return[cf(),{k:'coachHandle',label:'Creator Handle',ph:'@username',half:true},{k:'followers',label:'Their Followers',type:'number',half:true},{k:'views',label:'Views',type:'number',half:true},{k:'viralityScore',label:'Virality (auto)',readonly:true,half:true},{k:'format',label:'Format',type:'select',half:true,opts:['Talking Head','B-roll + Voiceover','Text on Screen','Tutorial / Demo','Mixed']},{k:'topic',label:'Topic',type:'select',half:true,opts:['Training Tips','Race Strategy','Transformation','Nutrition','Mindset','Gear','Q&A','Behind the Scenes','Controversial Take','Other']},{k:'hookText',label:'Original Hook — exact words',type:'textarea'},{k:'scriptSummary',label:'Script Summary + Why It Worked',type:'textarea'},{k:'ctaWording',label:'Original CTA',type:'textarea'},{k:'link',label:'Reel URL',ph:'https://instagram.com/reel/...'}]}
function renderReels(){
  const reels=forC(S.get('reels')||[]);
  return`<div class="ph"><div class="ph-title">Source Reels</div><div class="ph-desc">Original top-performing Reels that were analysed. The rescripted versions are in Content Pipeline.</div><div class="ph-actions"><button class="btn btn-p" onclick="addReel()">+ Add Reel</button><span style="font-size:12px;color:#9ca3af">${reels.length} reels</span></div></div>
  <div class="card-grid">${reels.length?reels.map(r=>`<div class="card"><div style="display:flex;gap:6px;flex-wrap:wrap">${vBadge(r.viralityScore)}<span class="b b-gray">${esc(r.format||'—')}</span><span class="b b-blue">${esc(r.topic||'—')}</span>${cBadge(r.clientId)}</div><div class="card-hook">"${esc(r.hookText)}"</div><div class="card-body">${esc(r.scriptSummary)}</div><div class="card-cta">▸ ${esc(r.ctaWording)}</div><div class="card-footer"><span style="font-size:12px;color:#9ca3af">${esc(r.coachHandle||'—')}</span><div class="card-actions">${r.link?`<a href="${esc(r.link)}" target="_blank" class="btn btn-g btn-s">View ↗</a>`:''}<button class="btn btn-g btn-s" onclick="editReel('${r.id}')">Edit</button><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('reels','${r.id}'),renderTab('Reels')">✕</button></div></div></div>`).join(''):'<div class="empty">No source reels yet. Run an Analyse to populate these.</div>'}</div>`;
}
function addReel(){openModal('Add Reel',reelF(),d=>{d.id=uid();d.dateAdded=new Date().toISOString().slice(0,10);d.viralityScore=vir(d.views,d.followers);S.upsert('reels',d);renderTab('Reels')})}
function editReel(id){const r=(S.get('reels')||[]).find(x=>x.id===id);openModal('Edit Reel',reelF(),d=>{d.id=id;d.dateAdded=r.dateAdded;d.viralityScore=vir(d.views,d.followers);S.upsert('reels',d);renderTab('Reels')},r)}

// ── COACHES ──────────────────────────────────────
function coachF(){return[cf(),{k:'handle',label:'Handle',ph:'@username'},{k:'followers',label:'Followers',type:'number',half:true},{k:'avgViews',label:'Avg Views',type:'number',half:true},{k:'viralityScore',label:'Virality',readonly:true,half:true},{k:'offerType',label:'What They Sell',type:'select',half:true,opts:['1:1 Coaching','Group Coaching','Training Plans','Course','App','Community','Other']},{k:'ctaType',label:'Lead Gen',type:'select',opts:['DM','Link in Bio','Comment','Save','Follow','Direct Offer','Content Only']},{k:'notes',label:'Notes',type:'textarea'}]}
function renderCoaches(){
  const c=forC(S.get('coaches')||[]);
  return`<div class="ph"><div class="ph-title">Competitor Coaches</div><div class="ph-desc">Coaches being tracked. Added automatically when you run an Analyse.</div><div class="ph-actions"><button class="btn btn-p" onclick="addCoach()">+ Add Manually</button><span style="font-size:12px;color:#9ca3af">${c.length} tracked</span></div></div>
  <div class="tw"><table><thead><tr><th>Handle</th><th>Followers</th><th>Avg Views</th><th>Virality</th><th>Offer</th><th>Lead Gen</th>${activeClient==='all'?'<th>Creator</th>':''}<th>Notes</th><th></th></tr></thead><tbody>${c.length?c.map(x=>`<tr><td><a href="https://instagram.com/${x.handle.replace('@','')}" target="_blank" style="font-weight:600;color:#111">${esc(x.handle)}</a></td><td>${fmt(x.followers)}</td><td>${fmt(x.avgViews)}</td><td>${vBadge(x.viralityScore)}</td><td><span class="b b-gray">${esc(x.offerType)}</span></td><td>${ctaBadge(x.ctaType)}</td>${activeClient==='all'?`<td>${cBadge(x.clientId)}</td>`:''}<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#6b7280">${esc(x.notes)}</td><td><div class="tda"><button class="btn btn-g btn-s" onclick="editCoach('${x.id}')">Edit</button><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('coaches','${x.id}'),renderTab('Coaches')">✕</button></div></td></tr>`).join(''):`<tr><td colspan="9"><div class="empty">No coaches yet.</div></td></tr>`}</tbody></table></div>`;
}
function addCoach(){openModal('Add Coach',coachF(),d=>{d.id=uid();d.createdAt=new Date().toISOString().slice(0,10);d.viralityScore=vir(d.avgViews,d.followers);S.upsert('coaches',d);renderTab('Coaches')})}
function editCoach(id){const c=(S.get('coaches')||[]).find(x=>x.id===id);openModal('Edit Coach',coachF(),d=>{d.id=id;d.createdAt=c.createdAt;d.viralityScore=vir(d.avgViews,d.followers);S.upsert('coaches',d);renderTab('Coaches')},c)}

// ── GAPS ─────────────────────────────────────────
function renderGaps(){
  const gaps=forC(S.get('contentGaps')||[]);const open=gaps.filter(g=>!g.covered).length,done=gaps.filter(g=>g.covered).length;
  return`<div class="ph"><div class="ph-title">Content Gaps</div><div class="ph-desc">Topics your audience wants that competitors aren't covering.</div><div class="ph-actions">${done?`<button class="btn btn-g btn-s" onclick="clearGaps()">Clear Done (${done})</button>`:''}<span style="font-size:12px;color:#9ca3af">${open} open · ${done} covered</span></div></div>
  ${gaps.map(g=>`<div class="gap-item ${g.covered?'done':''}"><input type="checkbox" class="gck" ${g.covered?'checked':''} onchange="S.tog('contentGaps','${g.id}','covered');renderTab('Gaps')"><div class="gap-tx">${cBadge(g.clientId)} ${esc(g.topic)}</div><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('contentGaps','${g.id}'),renderTab('Gaps')">✕</button></div>`).join('')||'<div class="empty">No gaps yet.</div>'}
  <div class="gadd"><input id="gap-inp" type="text" placeholder="Topic your audience wants that nobody is covering..." onkeydown="if(event.key==='Enter')saveGap()"><button class="btn btn-p" onclick="saveGap()">Add Gap</button></div>`;
}
function saveGap(){const inp=document.getElementById('gap-inp');if(!inp||!inp.value.trim())return;const cid=activeClient!=='all'?activeClient:((S.get('clients')||[])[0]?.id||'');S.upsert('contentGaps',{id:uid(),clientId:cid,topic:inp.value.trim(),covered:false});renderTab('Gaps')}
function clearGaps(){const all=S.get('contentGaps')||[],keep=all.filter(g=>!g.covered);all.length=0;keep.forEach(x=>all.push(x));S.save();renderTab('Gaps')}

// ── ROUTER ───────────────────────────────────────
const RENDERERS={Analyse:renderAnalyse,'Content Pipeline':renderContentPipeline,'CTA Bank':renderCTABank,Reels:renderReels,Coaches:renderCoaches,Gaps:renderGaps};
let activeTab=TABS[0];
function renderTab(name){
  activeTab=name;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  document.querySelectorAll('.tp').forEach(p=>p.classList.toggle('on',p.id===`tp-${TID[name]}`));
  const panel=document.getElementById(`tp-${TID[name]}`);
  if(panel)panel.innerHTML=RENDERERS[name]()||'';
}

// ── INIT ─────────────────────────────────────────
async function init(){
  await S.load();
  if(!S.get('competitors'))S.get('clients'); // ensure loaded
  renderSidebar();renderTopbar();
  document.getElementById('tabs').innerHTML=TABS.map(t=>`<button class="tbtn ${t===activeTab?'on':''}" data-tab="${t}" onclick="renderTab('${t}')">${t}</button>`).join('');
  document.getElementById('tc').innerHTML=TABS.map(t=>`<div class="tp ${t===activeTab?'on':''}" id="tp-${TID[t]}"></div>`).join('');
  renderTab(activeTab);
}
init();
</script>
</body>
</html>
