<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:#f5f5f5;color:#111}
button{cursor:pointer;border:none;background:none;font-family:inherit;font-size:inherit;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:#111;background:#fff;border:1px solid #d1d5db;border-radius:6px;padding:8px 11px;width:100%;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
textarea{resize:vertical;min-height:72px}
select option{background:#fff}
label{display:block;font-size:11px;color:#6b7280;margin-bottom:4px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
a{color:#3b82f6;text-decoration:none}
a:hover{text-decoration:underline}

/* Layout */
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:#fff;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Sidebar */
.sb-logo{padding:18px 16px 14px;font-size:13px;font-weight:800;letter-spacing:-.2px;border-bottom:1px solid #e5e7eb;color:#111}
.sb-logo span{color:#3b82f6}
.sb-section{padding:10px 10px 4px;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#9ca3af}
.creator-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;margin:1px 4px;width:calc(100% - 8px);font-size:13px;font-weight:600;color:#374151;transition:all .14s;text-align:left}
.creator-btn:hover{background:#f3f4f6}
.creator-btn.active{background:#eff6ff;color:#1d4ed8}
.creator-btn .cav{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.creator-btn .cname{flex:1;min-width:0}
.creator-btn .chdl{font-size:11px;font-weight:400;color:#9ca3af;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.creator-btn.active .chdl{color:#93c5fd}
.sb-add{display:flex;align-items:center;gap:8px;width:calc(100% - 8px);margin:1px 4px;padding:8px 12px;border-radius:8px;color:#9ca3af;font-size:13px;border:1.5px dashed #e5e7eb;transition:all .14s}
.sb-add:hover{border-color:#3b82f6;color:#3b82f6}
.sb-divider{border-top:1px solid #e5e7eb;margin:8px 12px}
.sb-nav-item{display:flex;align-items:center;gap:8px;width:calc(100% - 8px);margin:1px 4px;padding:8px 12px;border-radius:8px;color:#6b7280;font-size:13px;font-weight:500;transition:all .14s;text-align:left}
.sb-nav-item:hover{background:#f9fafb;color:#111}
.sb-nav-item.active{background:#f0fdf4;color:#15803d;font-weight:600}

/* Top bar */
.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-l{display:flex;align-items:center;gap:12px}
.page-title{font-size:15px;font-weight:700;color:#111}
.creator-tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.topbar-r{display:flex;align-items:center;gap:8px}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid #e5e7eb;background:#fff;padding:0 24px;flex-shrink:0;overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tbtn{padding:12px 16px;font-size:13px;font-weight:500;color:#6b7280;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:all .14s}
.tbtn:hover{color:#111}
.tbtn.on{color:#1d4ed8;border-bottom-color:#3b82f6;font-weight:600}

/* Content */
.tc{flex:1;overflow-y:auto;padding:24px;background:#f9fafb}
.tp{display:none}.tp.on{display:block}

/* Page header */
.ph{margin-bottom:20px}
.ph-title{font-size:17px;font-weight:700;margin-bottom:3px}
.ph-desc{font-size:13px;color:#6b7280;max-width:600px;line-height:1.5}
.ph-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;transition:all .14s;cursor:pointer;border:none}
.btn-p{background:#3b82f6;color:#fff}.btn-p:hover{background:#2563eb}
.btn-g{background:#fff;color:#374151;border:1px solid #d1d5db}.btn-g:hover{background:#f9fafb;border-color:#9ca3af}
.btn-d{background:#fff;color:#ef4444;border:1px solid #fecaca}.btn-d:hover{background:#fef2f2;border-color:#ef4444}
.btn-gen{background:#111;color:#fff}.btn-gen:hover{background:#374151}
.btn-s{padding:4px 10px;font-size:12px}

/* Cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card:hover{border-color:#d1d5db;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-title{font-size:14px;font-weight:700;color:#111}
.card-hook{font-size:13px;color:#1d4ed8;font-style:italic;line-height:1.5;border-left:3px solid #3b82f6;padding-left:10px}
.card-body{font-size:13px;color:#6b7280;line-height:1.6}
.card-cta{font-size:12px;color:#15803d;background:#f0fdf4;padding:6px 10px;border-radius:6px;border:1px solid #bbf7d0;line-height:1.5}
.card-footer{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid #f3f4f6;flex-wrap:wrap;gap:6px}
.card-actions{display:flex;gap:5px;flex-wrap:wrap}

/* Badges */
.b{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-blue{background:#dbeafe;color:#1d4ed8}
.b-green{background:#dcfce7;color:#15803d}
.b-yellow{background:#fef9c3;color:#a16207}
.b-purple{background:#f3e8ff;color:#7e22ce}
.b-gray{background:#f3f4f6;color:#374151}
.b-red{background:#fee2e2;color:#b91c1c}
.b-orange{background:#fff7ed;color:#c2410c}

/* Table */
.tw{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:#f9fafb;padding:9px 14px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#6b7280;border-bottom:1px solid #e5e7eb;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #f3f4f6;vertical-align:middle;font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.tda{display:flex;gap:5px}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.kcol{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px;min-height:140px}
.kch{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#6b7280;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.kcnt{background:#f3f4f6;padding:1px 7px;border-radius:20px;font-size:11px;color:#6b7280}
.kcol[data-s=Idea] .kch{color:#3b82f6}
.kcol[data-s=Scripted] .kch{color:#d97706}
.kcol[data-s=Filmed] .kch{color:#7c3aed}
.kcol[data-s=Posted] .kch{color:#15803d}
.kcard{background:#f9fafb;border:1px solid #e5e7eb;border-radius:7px;padding:10px;margin-bottom:6px;cursor:pointer;transition:all .14s}
.kcard:hover{border-color:#3b82f6;background:#eff6ff}
.kct{font-size:13px;font-weight:600;color:#111;margin-bottom:4px}
.kchook{font-size:11px;color:#3b82f6;font-style:italic;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:5px;line-height:1.4}
.kcta{font-size:11px;color:#15803d;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kcft{margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:5px;flex-wrap:wrap}

/* Idea detail */
.idea-detail{background:#fff;border:1px solid #3b82f6;border-radius:10px;padding:20px;margin-top:14px;display:flex;flex-direction:column;gap:14px}
.idea-detail-hdr{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px}
.dlbl{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#9ca3af;margin-bottom:5px}
.script-box{font-size:12px;line-height:1.7;color:#374151;white-space:pre-wrap;background:#f9fafb;border:1px solid #e5e7eb;border-radius:7px;padding:12px;font-family:monospace}
.script-box .ph-hl{color:#1d4ed8;background:#dbeafe;padding:0 3px;border-radius:3px;font-family:monospace}
.cta-box{background:#f0fdf4;border:1px solid #86efac;border-radius:7px;padding:10px 14px;font-size:13px;color:#15803d;line-height:1.5}

/* CTA Bank */
.cta-grp{margin-bottom:22px}
.cta-grp-hdr{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#6b7280;padding-bottom:8px;border-bottom:1px solid #e5e7eb;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.cta-list{display:flex;flex-direction:column;gap:6px}
.cta-it{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e5e7eb;border-radius:7px;padding:10px 12px;transition:all .14s}
.cta-it.used{border-color:#86efac;background:#f0fdf4}
.cta-tx{flex:1;font-size:13px;line-height:1.4;color:#111}
.cta-ac{display:flex;gap:5px;flex-shrink:0}
.cta-add-row{display:flex;gap:7px;margin-top:8px}.cta-add-row input{flex:1}

/* Gaps */
.gap-item{display:flex;align-items:flex-start;gap:10px;padding:11px;background:#fff;border:1px solid #e5e7eb;border-radius:7px;margin-bottom:6px;max-width:680px}
.gap-item.done{opacity:.4}
.gap-item.done .gap-tx{text-decoration:line-through}
.gck{width:16px;height:16px;accent-color:#3b82f6;cursor:pointer;flex-shrink:0;margin-top:2px}
.gap-tx{flex:1;font-size:13px;line-height:1.5;color:#111}
.gadd{display:flex;gap:7px;margin-top:10px;max-width:680px}.gadd input{flex:1}

/* Tip box */
.tip{background:#eff6ff;border:1px solid #bfdbfe;border-radius:7px;padding:10px 14px;font-size:13px;color:#374151;margin-bottom:16px;line-height:1.6}
.tip strong{color:#1d4ed8}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:#9ca3af;font-size:13px}

/* Stat cards */
.stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.stat{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px}
.stat-n{font-size:24px;font-weight:800;color:#111;line-height:1}
.stat-l{font-size:12px;color:#6b7280;margin-top:4px}

/* Modal */
.bdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:20px}
.bdrop.on{display:flex}
.modal{background:#fff;border:1px solid #e5e7eb;border-radius:14px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #e5e7eb}
.mttl{font-size:15px;font-weight:700;color:#111}
.mbdy{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.mft{padding:14px 20px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:8px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ff{display:flex;flex-direction:column}
.swatches{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.sw{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .14s}
.sw.on{border-color:#111;transform:scale(1.15)}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#111;color:#fff;padding:9px 16px;border-radius:7px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* Prompt box */
.prompt-box{font-family:monospace;font-size:11px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:7px;padding:12px;line-height:1.6;color:#374151;white-space:pre-wrap;max-height:260px;overflow-y:auto}
.imp-ta{font-family:monospace;font-size:12px;min-height:110px}

/* Virality */
.vir-hot{background:#fee2e2;color:#b91c1c}
.vir-good{background:#dcfce7;color:#15803d}
.vir-ok{background:#dbeafe;color:#1d4ed8}

@media(max-width:900px){.kanban{grid-template-columns:1fr 1fr}.frow{grid-template-columns:1fr}.sidebar{width:180px}}
@media(max-width:640px){.sidebar{display:none}.kanban{grid-template-columns:1fr}.tc{padding:14px}table th:nth-child(n+5),table td:nth-child(n+5){display:none}}
</style>
</head>

// ── STATE ────────────────────────────────────────
const S=(()=>{
  let d=null;
  function load(){
    const raw=localStorage.getItem('ird_v6');
    if(raw){d=JSON.parse(raw);}
    else{
      const old=localStorage.getItem('ird_v5')||localStorage.getItem('ird_v4')||localStorage.getItem('ur_dashboard_v3')||localStorage.getItem('ur_dashboard');
      d=old?JSON.parse(old):JSON.parse(JSON.stringify(DEFAULTS));
      if(!d.clients)d.clients=JSON.parse(JSON.stringify(DEFAULTS.clients));
      // ensure handles on clients
      d.clients.forEach(c=>{if(!c.handle)c.handle=c.id==='cl1'?'@runwithnick':c.id==='cl2'?'@joshc.laker':''});
      ['coaches','reels','ctaBank','contentIdeas','contentGaps'].forEach(s=>{(d[s]||[]).forEach(x=>{if(!x.clientId)x.clientId='cl2'})});
      // inject missing cl1 ideas
      const hasCl1=d.contentIdeas&&d.contentIdeas.some(x=>x.clientId==='cl1');
      if(!hasCl1){DEFAULTS.contentIdeas.filter(x=>x.clientId==='cl1').forEach(item=>{if(!d.contentIdeas)d.contentIdeas=[];if(!d.contentIdeas.find(x=>x.id===item.id))d.contentIdeas.push(JSON.parse(JSON.stringify(item)))})}
      d.meta={version:6,lastSaved:null};
      save();
    }
  }
  function save(){d.meta.lastSaved=new Date().toISOString();localStorage.setItem('ird_v6',JSON.stringify(d));const el=document.getElementById('last-saved');if(el)el.textContent='Saved '+new Date().toLocaleTimeString()}
  function get(k){return d[k]}
  function upsert(sec,item){const i=d[sec].findIndex(x=>x.id===item.id);if(i>=0)d[sec][i]=item;else d[sec].unshift(item);save()}
  function del(sec,id){d[sec]=d[sec].filter(x=>x.id!==id);save()}
  function tog(sec,id,f){const x=d[sec].find(x=>x.id===id);if(x){x[f]=!x[f];save()}}
  function setF(sec,id,f,v){const x=d[sec].find(x=>x.id===id);if(x){x[f]=v;save()}}
  return{load,save,get,upsert,del,tog,setF};
})();

function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(n){if(!n)return'—';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n)}
function vir(v,f){if(!f)return 0;return+((v/f)*100).toFixed(1)}
function vBadge(s){if(!s)return'<span class="b b-gray">—</span>';if(s>=200)return`<span class="b vir-hot">🔥 ${s}%</span>`;if(s>=50)return`<span class="b vir-good">⚡ ${s}%</span>`;if(s>=10)return`<span class="b vir-ok">${s}%</span>`;return`<span class="b b-gray">${s}%</span>`}
function sBadge(s){const m={Idea:'b-blue',Scripted:'b-yellow',Filmed:'b-purple',Posted:'b-green'};return`<span class="b ${m[s]||'b-gray'}">${s}</span>`}
function ctaBadge(t){const m={DM:'b-green','Link in Bio':'b-purple',Comment:'b-yellow',Save:'b-blue',Follow:'b-gray','Direct Offer':'b-red'};return`<span class="b ${m[t]||'b-gray'}">${t}</span>`}
function hlPh(t){return esc(t).replace(/\[([^\]]+)\]/g,'<span class="ph-hl">[$1]</span>')}
async function cp(text,btn){try{if(navigator.clipboard)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta)}if(btn){const o=btn.textContent;btn.textContent='✓ Copied!';setTimeout(()=>btn.textContent=o,1500)}toast('Copied!')}catch{toast('Copy failed')}}

function buildFields(fields,init){const rows=[];let buf=[];fields.forEach((f,i)=>{const el=buildF(f,init[f.k]);if(f.half){buf.push(el);if(buf.length===2||i===fields.length-1){rows.push(`<div class="frow">${buf.join('')}</div>`);buf=[]}}else{if(buf.length){rows.push(`<div class="frow">${buf.join('')}</div>`);buf=[]}rows.push(`<div class="ff">${el}</div>`)}});return rows.join('')}
function buildF(f,val){const v=val!=null?val:(f.def||'');let inp='';if(f.type==='textarea')inp=`<textarea data-f="${f.k}" rows="3">${esc(v)}</textarea>`;else if(f.type==='select'){const opts=f.opts.map((o,i)=>`<option value="${esc(f.vals?f.vals[i]:o)}" ${(f.vals?f.vals[i]:o)===v?'selected':''}>${esc(o)}</option>`).join('');inp=`<select data-f="${f.k}">${opts}</select>`}else if(f.type==='number')inp=`<input type="number" data-f="${f.k}" value="${esc(String(v))}" min="0">`;else if(f.readonly)inp=`<input type="text" data-f="${f.k}" value="${esc(v)}" readonly style="opacity:.5;pointer-events:none">`;else inp=`<input type="text" data-f="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;return`<div class="ff"><label>${esc(f.label)}</label>${inp}</div>`}

function renderOverview(){
  const clients=activeClient==='all'?S.get('clients'):[S.get('clients').find(x=>x.id===activeClient)].filter(Boolean);
  let h=`<div class="ph"><div class="ph-title">Overview</div><div class="ph-desc">At a glance summary for ${activeClient==='all'?'all creators':'this creator'}.</div></div>`;
  clients.forEach(c=>{
    const coaches=S.get('coaches').filter(x=>x.clientId===c.id);
    const reels=S.get('reels').filter(x=>x.clientId===c.id);
    const ideas=S.get('contentIdeas').filter(x=>x.clientId===c.id);
    const ctas=S.get('ctaBank').filter(x=>x.clientId===c.id);
    const gaps=S.get('contentGaps').filter(x=>x.clientId===c.id&&!x.covered);
    const posted=ideas.filter(x=>x.status==='Posted').length;
    const scripted=ideas.filter(x=>x.status==='Scripted').length;
    const initials=c.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    h+=`<div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
        <div class="cav" style="background:${c.color};width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0">${initials}</div>
        <div><div style="font-weight:700;font-size:15px">${esc(c.name)}</div><div style="font-size:12px;color:#9ca3af">${esc(c.handle||'')}</div></div>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="stat-n">${coaches.length}</div><div class="stat-l">Competitors tracked</div></div>
        <div class="stat"><div class="stat-n">${reels.length}</div><div class="stat-l">Reels researched</div></div>
        <div class="stat"><div class="stat-n">${ideas.length}</div><div class="stat-l">Content ideas</div></div>
        <div class="stat"><div class="stat-n">${posted}</div><div class="stat-l">Posted</div></div>
        <div class="stat"><div class="stat-n">${scripted}</div><div class="stat-l">Scripted</div></div>
        <div class="stat"><div class="stat-n">${gaps}</div><div class="stat-l">Content gaps open</div></div>
      </div>
      ${ideas.filter(x=>x.status==='Scripted').length?`<div style="margin-top:4px"><div style="font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#9ca3af;margin-bottom:8px">Ready to Film</div><div style="display:flex;flex-direction:column;gap:6px">${ideas.filter(x=>x.status==='Scripted').map(i=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fefce8;border:1px solid #fef08a;border-radius:7px;cursor:pointer" onclick="renderTab('Content Pipeline');setTimeout(()=>openIdea('${i.id}'),100)"><div style="flex:1;font-size:13px;font-weight:600">${esc(i.title)}</div><div style="font-size:11px;color:#a16207">${esc(i.ctaType)}</div></div>`).join('')}</div></div>`:''}
    </div>`;
  });
  return h;
}

// ── COACHES ──────────────────────────────────────
function coachF(){return[cf(),{k:'handle',label:'Instagram Handle',ph:'@username'},{k:'followers',label:'Followers',type:'number',half:true},{k:'avgViews',label:'Avg Views/Reel',type:'number',half:true},{k:'viralityScore',label:'Virality (auto-calc)',readonly:true,half:true},{k:'offerType',label:'What They Sell',type:'select',half:true,opts:['1:1 Coaching','Group Coaching','Training Plans','Course','App','Community','Hybrid','Other']},{k:'ctaType',label:'Lead Gen Method',type:'select',opts:['DM','Link in Bio','Comment','Save','Follow','Direct Offer','Content → Podcast','DM + Community','Content Only']},{k:'notes',label:'Notes',type:'textarea'}]}
function renderCoaches(){
  const c=forC(S.get('coaches'));
  return`<div class="ph"><div class="ph-title">Competitor Coaches</div><div class="ph-desc">Track what other coaches are doing — their audience size, offer, and how they generate leads.</div><div class="ph-actions"><button class="btn btn-p" onclick="addCoach()">+ Add Coach</button><span style="font-size:12px;color:#9ca3af">${c.length} tracked</span></div></div>
  <div class="tw"><table><thead><tr><th>Handle</th><th>Followers</th><th>Avg Views</th><th>Virality</th><th>Offer</th><th>Lead Gen</th>${activeClient==='all'?'<th>Creator</th>':''}<th>Notes</th><th></th></tr></thead><tbody>${c.length?c.map(x=>`<tr><td><a href="https://instagram.com/${x.handle.replace('@','')}" target="_blank" style="font-weight:600;color:#111">${esc(x.handle)}</a></td><td>${fmt(x.followers)}</td><td>${fmt(x.avgViews)}</td><td>${vBadge(x.viralityScore)}</td><td><span class="b b-gray">${esc(x.offerType)}</span></td><td>${ctaBadge(x.ctaType)}</td>${activeClient==='all'?`<td>${cBadge(x.clientId)}</td>`:''}<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#6b7280">${esc(x.notes)}</td><td><div class="tda"><button class="btn btn-g btn-s" onclick="editCoach('${x.id}')">Edit</button><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('coaches','${x.id}'),renderTab('Coaches')">✕</button></div></td></tr>`).join(''):`<tr><td colspan="9"><div class="empty">No coaches yet. Add one to start tracking.</div></td></tr>`}</tbody></table></div>`;
}
function addCoach(){openModal('Add Coach',coachF(),d=>{d.id=uid();d.createdAt=new Date().toISOString().slice(0,10);d.viralityScore=vir(d.avgViews,d.followers);S.upsert('coaches',d);renderTab('Coaches')})}
function editCoach(id){const c=S.get('coaches').find(x=>x.id===id);openModal('Edit Coach',coachF(),d=>{d.id=id;d.createdAt=c.createdAt;d.viralityScore=vir(d.avgViews,d.followers);S.upsert('coaches',d);renderTab('Coaches')},c)}

// ── REELS ────────────────────────────────────────
function reelF(){return[cf(),{k:'coachHandle',label:'Coach Handle',ph:'@username',half:true},{k:'followers',label:'Their Followers',type:'number',half:true},{k:'views',label:'Views',type:'number',half:true},{k:'viralityScore',label:'Virality (auto)',readonly:true,half:true},{k:'format',label:'Format',type:'select',half:true,opts:['Talking Head','B-roll + Voiceover','Text on Screen','Tutorial / Demo','Transformation','Mixed']},{k:'topic',label:'Topic',type:'select',half:true,opts:['Training Tips','Race Strategy','Transformation','Nutrition','Mindset','Gear','Q&A','Behind the Scenes','Controversial Take','Other']},{k:'hookText',label:'Opening Hook — exact words',type:'textarea'},{k:'scriptSummary',label:'Script Summary',type:'textarea'},{k:'ctaWording',label:'Call to Action — exact words',type:'textarea'},{k:'link',label:'Reel URL',ph:'https://instagram.com/reel/...'}]}
function renderReels(){
  const all=forC(S.get('reels'));
  const tF=document.getElementById('rf-t')?.value||'';
  const topics=[...new Set(all.map(r=>r.topic))].filter(Boolean);
  const reels=all.filter(r=>!tF||r.topic===tF);
  return`<div class="ph"><div class="ph-title">Reels Research</div><div class="ph-desc">Top-performing Reels — hooks, scripts, and CTAs worth learning from and adapting.</div><div class="ph-actions"><button class="btn btn-p" onclick="addReel()">+ Add Reel</button><select id="rf-t" onchange="renderTab('Reels')" style="max-width:160px"><option value="">All Topics</option>${topics.map(t=>`<option value="${esc(t)}" ${t===tF?'selected':''}>${esc(t)}</option>`).join('')}</select><span style="font-size:12px;color:#9ca3af">${reels.length} reels</span></div></div>
  <div class="card-grid">${reels.length?reels.map(r=>`<div class="card"><div style="display:flex;gap:6px;flex-wrap:wrap">${vBadge(r.viralityScore)}<span class="b b-gray">${esc(r.format||'—')}</span><span class="b b-blue">${esc(r.topic||'—')}</span>${cBadge(r.clientId)}</div><div class="card-hook">"${esc(r.hookText)}"</div><div><div class="dlbl" style="margin-bottom:4px">Script</div><div class="card-body">${esc(r.scriptSummary)}</div></div><div class="card-cta">▸ ${esc(r.ctaWording)}</div><div class="card-footer"><span style="font-size:12px;color:#9ca3af">${esc(r.coachHandle||'—')}</span><div class="card-actions">${r.link?`<a href="${esc(r.link)}" target="_blank" class="btn btn-g btn-s">View ↗</a>`:''}<button class="btn btn-g btn-s" onclick="editReel('${r.id}')">Edit</button><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('reels','${r.id}'),renderTab('Reels')">✕</button></div></div></div>`).join(''):'<div class="empty">No reels yet.</div>'}</div>`;
}
function addReel(){openModal('Add Reel',reelF(),d=>{d.id=uid();d.dateAdded=new Date().toISOString().slice(0,10);d.viralityScore=vir(d.views,d.followers);S.upsert('reels',d);renderTab('Reels')})}
function editReel(id){const r=S.get('reels').find(x=>x.id===id);openModal('Edit Reel',reelF(),d=>{d.id=id;d.dateAdded=r.dateAdded;d.viralityScore=vir(d.views,d.followers);S.upsert('reels',d);renderTab('Reels')},r)}

// ── CTA BANK ─────────────────────────────────────
function renderCTABank(){
  const ctas=forC(S.get('ctaBank'));const used=ctas.filter(c=>c.usedIt).length;
  let h=`<div class="ph"><div class="ph-title">CTA Bank</div><div class="ph-desc">Ready-to-use calls to action. Copy straight into your next Reel script.</div></div><div class="tip"><strong>DM CTAs convert at 12–25%.</strong> Link in Bio converts at 1.5–3%. &nbsp;·&nbsp; ${used}/${ctas.length} used so far.</div>`;
  CTA_TYPES.forEach(type=>{
    const items=ctas.filter(c=>c.type===type);
    const safe=type.replace(/\s+/g,'-').replace(/[^a-zA-Z0-9-]/g,'');
    h+=`<div class="cta-grp"><div class="cta-grp-hdr"><span>${type}</span><span style="font-weight:400;color:#9ca3af">${items.filter(c=>c.usedIt).length}/${items.length} used &nbsp;<button class="btn btn-g btn-s" onclick="showCtaForm('${safe}')">+ Add</button></span></div><div class="cta-list">${items.map(c=>`<div class="cta-it ${c.usedIt?'used':''}"><div class="cta-tx">${cBadge(c.clientId)} ${esc(c.text)}</div><div class="cta-ac"><button class="btn btn-g btn-s" onclick="cp('${esc(c.text.replace(/'/g,"\\'"))}',this)">Copy</button><button class="btn btn-g btn-s" onclick="S.tog('ctaBank','${c.id}','usedIt');renderTab('CTA Bank')">${c.usedIt?'✓ Used':'Mark Used'}</button><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('ctaBank','${c.id}'),renderTab('CTA Bank')">✕</button></div></div>`).join('')||`<div style="font-size:13px;color:#9ca3af;padding:6px 0">None yet.</div>`}</div><div class="cta-add-row" id="ca-${safe}" style="display:none"><input id="ci-${safe}" type="text" placeholder="New ${esc(type)} CTA..." onkeydown="if(event.key==='Enter')saveCTA('${safe}','${esc(type)}')"><button class="btn btn-p btn-s" onclick="saveCTA('${safe}','${esc(type)}')">Add</button><button class="btn btn-g btn-s" onclick="document.getElementById('ca-${safe}').style.display='none'">✕</button></div></div>`;
  });return h;
}
function showCtaForm(safe){const el=document.getElementById(`ca-${safe}`);if(el){el.style.display='flex';el.querySelector('input')?.focus()}}
function saveCTA(safe,type){const inp=document.getElementById(`ci-${safe}`);if(!inp||!inp.value.trim())return;const cid=activeClient!=='all'?activeClient:(S.get('clients')[0]?.id||'');S.upsert('ctaBank',{id:uid(),clientId:cid,type,text:inp.value.trim(),usedIt:false});renderTab('CTA Bank')}

// ── CONTENT PIPELINE ─────────────────────────────
function ideaF(){return[cf(),
  {k:'title',label:'Idea Title',ph:'e.g. Why Beginners Quit'},
  {k:'hook',label:'Opening Hook — the first line that stops the scroll',type:'textarea'},
  {k:'scriptOutline',label:'Script Outline',type:'textarea'},
  {k:'scriptTemplate',label:'Full Script (use [BRACKETS] for fill-in parts)',type:'textarea'},
  {k:'ctaRecommendation',label:'Best Call to Action',type:'textarea'},
  {k:'ctaType',label:'CTA Type',type:'select',opts:['DM','Comment','Save','Link in Bio','Follow','Direct Offer'],half:true},
  {k:'status',label:'Stage',type:'select',half:true,opts:['Idea','Scripted','Filmed','Posted']},
]}

function generatePrompt(){
  const clients=S.get('clients');
  const cl=activeClient!=='all'?clients.find(x=>x.id===activeClient):null;
  const coaches=forC(S.get('coaches')).slice(0,6).map(c=>c.handle).join(', ');
  const existing=forC(S.get('contentIdeas')).slice(0,5).map(i=>i.title).join('; ');
  const clientDesc=cl?`Creator: ${cl.name} (${cl.handle||''})`:'Creators: Nick Hancock @runwithnick AND Josh Laker @joshc.laker';
  const prompt=`You are a content research agent for Instagram running coaches.

${clientDesc}

Competitor accounts to study: ${coaches||'@trackclubbabe, @runningexplained, @stephpiruns, @mr.ultrarunner'}

Existing ideas (don't duplicate): ${existing||'none yet'}

Search Instagram and the web for viral running coach Reels from the last 30 days. Generate 5 brand new content ideas based on what is performing well right now.

Output ONLY valid JSON in this exact format — no explanation, just the JSON:

{
  "clientId": "${activeClient!=='all'?activeClient:'cl1'}",
  "contentIdeas": [
    {
      "title": "Short punchy title",
      "hook": "Exact opening line that stops the scroll",
      "scriptOutline": "Brief outline: hook → problem → solution → CTA",
      "scriptTemplate": "[HOOK]\\n\\"...opening line...\\"\\n\\n[PROBLEM]\\n\\"...pain point...\\"\\n\\n[SOLUTION]\\n\\"...value...\\"\\n\\n[CTA]\\n\\"...call to action...\\"",
      "ctaRecommendation": "Exact CTA wording",
      "ctaType": "DM",
      "status": "Idea"
    }
  ],
  "ctaBank": [{"type": "DM", "text": "Any new CTA formats spotted"}],
  "contentGaps": [{"topic": "Any gaps competitors are missing"}]
}`;
  cp(prompt);
  openModal('🤖 Generate New Ideas',[],()=>{},null,`
    <div class="tip"><strong>How this works:</strong><br>1. The prompt is copied to your clipboard<br>2. Paste it into a new Claude conversation<br>3. Claude will research and output JSON<br>4. Come back and click "⬇ Import" in the top bar, paste the JSON</div>
    <div class="ff"><label>Your Research Prompt (already copied)</label><div class="prompt-box">${esc(prompt)}</div></div>
    <div style="margin-top:8px"><button class="btn btn-p btn-s" onclick="cp(document.querySelector('.prompt-box').textContent,this)">Copy Again</button></div>`);
  document.getElementById('msave').style.display='none';
}

function renderContentPipeline(){
  const ideas=forC(S.get('contentIdeas'));
  const cols=KCOLS.map(status=>{
    const items=ideas.filter(i=>i.status===status);
    return`<div class="kcol" data-s="${status}"><div class="kch">${status}<span class="kcnt">${items.length}</span></div>${items.map(i=>`<div class="kcard" onclick="openIdea('${i.id}')"><div class="kct">${esc(i.title)}</div><div class="kchook">"${esc(i.hook)}"</div><div class="kcta">▸ ${esc(i.ctaRecommendation||'No CTA set')}</div><div class="kcft">${cBadge(i.clientId)}<div style="display:flex;gap:4px"><select class="btn btn-g btn-s" onclick="event.stopPropagation()" onchange="S.setF('contentIdeas','${i.id}','status',this.value);renderTab('Content Pipeline')" style="width:auto;padding:3px 7px">${KCOLS.map(s=>`<option ${s===i.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn btn-d btn-s" onclick="event.stopPropagation();if(confirm('Delete?'))S.del('contentIdeas','${i.id}'),renderTab('Content Pipeline')">✕</button></div></div></div>`).join('')||`<div style="font-size:12px;color:#9ca3af;padding:4px 0">Empty</div>`}</div>`;
  }).join('');

  return`<div class="ph">
    <div class="ph-title">Content Pipeline</div>
    <div class="ph-desc">Every idea has its hook, full script, and best CTA in one place. Click any card to see the complete brief ready to record.</div>
    <div class="ph-actions">
      <button class="btn btn-gen" onclick="generatePrompt()">🤖 Generate Ideas with AI</button>
      <button class="btn btn-p" onclick="addIdea()">+ Add Manually</button>
      <span style="font-size:12px;color:#9ca3af">${ideas.filter(i=>i.status==='Posted').length} posted · ${ideas.length} total</span>
    </div>
  </div>
  <div class="kanban">${cols}</div>
  <div id="idea-detail"></div>`;
}

function openIdea(id){
  const i=S.get('contentIdeas').find(x=>x.id===id);if(!i)return;
  const el=document.getElementById('idea-detail');if(!el)return;
  el.innerHTML=`<div class="idea-detail">
    <div class="idea-detail-hdr">
      <div style="font-size:16px;font-weight:700;color:#111">${esc(i.title)}</div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${sBadge(i.status)} ${ctaBadge(i.ctaType||'DM')} ${cBadge(i.clientId)}</div>
    </div>
    <div><div class="dlbl">Opening Hook</div><div class="card-hook" style="font-size:14px">"${esc(i.hook)}"</div></div>
    ${i.scriptTemplate?`<div><div class="dlbl">Full Script — fill in the [BRACKETS]</div><pre class="script-box">${hlPh(i.scriptTemplate)}</pre></div>`:''}
    ${i.scriptOutline&&!i.scriptTemplate?`<div><div class="dlbl">Script Outline</div><div class="card-body" style="white-space:pre-wrap">${esc(i.scriptOutline)}</div></div>`:''}
    <div><div class="dlbl">Best Call to Action</div><div class="cta-box">${esc(i.ctaRecommendation||'No CTA set')}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:4px">
      <button class="btn btn-p btn-s" onclick="cp(${JSON.stringify((i.hook||'')+'\n\n'+(i.scriptTemplate||i.scriptOutline||'')+'\n\nCTA: '+(i.ctaRecommendation||''))},this)">Copy Full Brief</button>
      <button class="btn btn-g btn-s" onclick="editIdea('${i.id}')">Edit</button>
      <button class="btn btn-g btn-s" onclick="document.getElementById('idea-detail').innerHTML=''">Close</button>
    </div>
  </div>`;
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function addIdea(){openModal('Add Content Idea',ideaF(),d=>{d.id=uid();d.createdAt=new Date().toISOString().slice(0,10);S.upsert('contentIdeas',d);renderTab('Content Pipeline')})}
function editIdea(id){const i=S.get('contentIdeas').find(x=>x.id===id);openModal('Edit Idea',ideaF(),d=>{d.id=id;d.createdAt=i.createdAt;S.upsert('contentIdeas',d);renderTab('Content Pipeline')},i)}

// ── GAPS ─────────────────────────────────────────
function renderGaps(){
  const gaps=forC(S.get('contentGaps'));const open=gaps.filter(g=>!g.covered).length,done=gaps.filter(g=>g.covered).length;
  return`<div class="ph"><div class="ph-title">Content Gaps</div><div class="ph-desc">Topics your audience wants that competitors aren't covering. Each unchecked gap is a Reel nobody is making.</div><div class="ph-actions">${done?`<button class="btn btn-g btn-s" onclick="clearGaps()">Clear Completed (${done})</button>`:''}<span style="font-size:12px;color:#9ca3af">${open} open · ${done} covered</span></div></div>
  ${gaps.map(g=>`<div class="gap-item ${g.covered?'done':''}"><input type="checkbox" class="gck" ${g.covered?'checked':''} onchange="S.tog('contentGaps','${g.id}','covered');renderTab('Gaps')"><div class="gap-tx">${cBadge(g.clientId)} ${esc(g.topic)}</div><button class="btn btn-d btn-s" onclick="if(confirm('Delete?'))S.del('contentGaps','${g.id}'),renderTab('Gaps')">✕</button></div>`).join('')||'<div class="empty">No gaps yet.</div>'}
  <div class="gadd"><input id="gap-inp" type="text" placeholder="Describe a topic your audience wants that nobody is covering..." onkeydown="if(event.key==='Enter')saveGap()"><button class="btn btn-p" onclick="saveGap()">Add Gap</button></div>`;
}
function saveGap(){const inp=document.getElementById('gap-inp');if(!inp||!inp.value.trim())return;const cid=activeClient!=='all'?activeClient:(S.get('clients')[0]?.id||'');S.upsert('contentGaps',{id:uid(),clientId:cid,topic:inp.value.trim(),covered:false});renderTab('Gaps')}
function clearGaps(){const all=S.get('contentGaps'),keep=all.filter(g=>!g.covered);all.length=0;keep.forEach(x=>all.push(x));S.save();renderTab('Gaps')}

// ── ROUTER ───────────────────────────────────────
const RENDERERS={Overview:renderOverview,Coaches:renderCoaches,Reels:renderReels,'CTA Bank':renderCTABank,'Content Pipeline':renderContentPipeline,Gaps:renderGaps};
let activeTab=TABS[0];
function renderTab(name){
  activeTab=name;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  document.querySelectorAll('.tp').forEach(p=>p.classList.toggle('on',p.id===`tp-${TID[name]}`));
  const panel=document.getElementById(`tp-${TID[name]}`);
  if(panel)panel.innerHTML=RENDERERS[name]()||'';
}

// ── INIT ─────────────────────────────────────────
function init(){
  S.load();renderSidebar();renderTopbar();
  document.getElementById('tabs').innerHTML=TABS.map(t=>`<button class="tbtn ${t===activeTab?'on':''}" data-tab="${t}" onclick="renderTab('${t}')">${t}</button>`).join('');
  document.getElementById('tc').innerHTML=TABS.map(t=>`<div class="tp ${t===activeTab?'on':''}" id="tp-${TID[t]}"></div>`).join('');
  renderTab(activeTab);
  const saved=S.get('meta').lastSaved;
  if(saved)document.getElementById('last-saved').textContent='Saved '+new Date(saved).toLocaleString();
}
init();
</script>
</body>
</html>
